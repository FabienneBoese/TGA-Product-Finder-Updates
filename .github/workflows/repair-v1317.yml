name: Repair and publish v1.3.17
on:
  push:
    paths:
      - '.github/workflows/repair-v1317.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild package from verified v1.3.16
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tga1317
          mkdir -p /tmp/tga1317
          unzip -q TGA_Product_Finder_Update_v1.3.16.zip -d /tmp/tga1317
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path("/tmp/tga1317/app.py")
          s=p.read_text(encoding="utf-8")
          s=s.replace('APP_VERSION = "1.3.16"', 'APP_VERSION = "1.3.17"', 1)
          s=s.replace('key="persistent_update_install_v1316"', 'key="persistent_update_install_v1317"', 1)
          if 'APP_VERSION = "1.3.17"' not in s:
              raise SystemExit("Versionswechsel in app.py fehlgeschlagen")
          p.write_text(s, encoding="utf-8")
          Path("/tmp/tga1317/version.json").write_text(json.dumps({"version":"1.3.17"}, indent=2), encoding="utf-8")
          PY
          rm -f TGA_Product_Finder_Update_v1.3.17.zip
          (cd /tmp/tga1317 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v1.3.17.zip" .)
          SHA=$(sha256sum TGA_Product_Finder_Update_v1.3.17.zip | awk '{print $1}')
          python3 - "$SHA" <<'PY'
          import json,sys
          sha=sys.argv[1]
          data={
            "version":"1.3.17",
            "download_url":"https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/main/TGA_Product_Finder_Update_v1.3.17.zip",
            "sha256":sha,
          }
          open("update_manifest.json","w",encoding="utf-8").write(json.dumps(data,indent=2)+"\n")
          PY
      - name: Commit repaired binary and manifest
        run: |
          git config user.name "TGA Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add TGA_Product_Finder_Update_v1.3.17.zip update_manifest.json
          git commit -m "Repair binary publish for TGA Product Finder v1.3.17"
          git push
