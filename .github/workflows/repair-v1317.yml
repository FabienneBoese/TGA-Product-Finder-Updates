name: Publish TGA Product Finder v1.5.3 sidebar navigation
on:
  push:
    paths:
      - '.github/workflows/repair-v1317.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify navigation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga153
          unzip -q TGA_Product_Finder_Update_v1.5.2.zip -d /tmp/tga153
          python3 - <<'PY'
          from pathlib import Path
          import json,py_compile
          p=Path('/tmp/tga153/app.py')
          s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "1.5.2"')==1
          s=s.replace('APP_VERSION = "1.5.2"','APP_VERSION = "1.5.3"',1)
          s=s.replace('persistent_update_install_v152','persistent_update_install_v153',1)
          a=s.index('# v1.4.0: Projektverwaltung – alte Projekte werden aus Komponenten übernommen.')
          b=s.index("with st.expander('➕ Neues Bauprojekt anlegen'):",a)
          c=s.index('con=db(); rows=con.execute(',b)
          d=s.index("if rows:\n st.divider(); st.subheader('📊 Projekt-Dokumentationsübersicht')",c)
          head=s[a:b]
          # Project selector is permanent in sidebar; navigation is the sidebar's entry point.
          head=head.replace("st.subheader('🏗️ Projektverwaltung')\n",'',1)
          head=head.replace("project=st.selectbox('Aktives Bauprojekt'", "project=st.sidebar.selectbox('Aktives Bauprojekt'",1)
          assert "st.sidebar.selectbox('Aktives Bauprojekt'" in head
          nav="""st.sidebar.markdown('---')
          st.sidebar.subheader('Navigation')
          _tga_page=st.sidebar.radio('Bereich öffnen', ['🏗️ Projektverwaltung','📊 Dokumentenübersicht'],key='tga_navigation',label_visibility='collapsed')
          """
          head=head+nav
          project_ui=s[b:c]
          project_ui="if _tga_page=='🏗️ Projektverwaltung':\n st.subheader('🏗️ Projektverwaltung')\n"+''.join(' '+line if line.strip() else line for line in project_ui.splitlines(keepends=True))
          overview=s[c:]
          # DB query is needed on both pages, but document overview and components must be behind navigation.
          query=overview[:overview.index('if rows:\n')]
          display=overview[len(query):]
          display="if _tga_page=='📊 Dokumentenübersicht':\n st.subheader('📊 Dokumentenübersicht')\n"+''.join(' '+line if line.strip() else line for line in display.splitlines(keepends=True))
          s=s[:a]+head+project_ui+query+display
          assert s.count("st.sidebar.radio('Bereich öffnen'")==1
          assert s.count("if _tga_page=='🏗️ Projektverwaltung':")==1
          assert s.count("if _tga_page=='📊 Dokumentenübersicht':")==1
          assert s.count('persistent_update_install_v153')==1
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          Path('/tmp/tga153/version.json').write_text(json.dumps({'version':'1.5.3'},indent=2)+'\n',encoding='utf-8')
          print('PASS: Python syntax, sidebar navigation, two page routes, update button retained')
          PY
          (cd /tmp/tga153 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v1.5.3.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v1.5.3.zip
          git config user.name "TGA Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add TGA_Product_Finder_Update_v1.5.3.zip
          git commit -m "Build v1.5.3 sidebar navigation"
          git push
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v1.5.3.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'1.5.3','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v1.5.3.zip','sha256':sha}
          open('update_manifest.json','w',encoding='utf-8').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m "Publish immutable v1.5.3 manifest"
          git push
