name: Inspect Excel import for v1.5.0
on:
  push:
    paths:
      - '.github/workflows/repair-v1317.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -p TGA_Product_Finder_Update_v1.5.0.zip app.py > app_v150_reference.py
          git config user.name "TGA Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app_v150_reference.py
          git commit -m "Store source reference for Excel import fix"
          git push
