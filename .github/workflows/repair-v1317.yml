name: Publish v1.8.1 Helios auto discovery fix
on:
  push:
    paths:
      - '.github/workflows/repair-v1317.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga181
          unzip -q TGA_Product_Finder_Update_v1.8.0.zip -d /tmp/tga181
          python3 - <<'PY'
          from pathlib import Path
          import json,py_compile,re
          p=Path('/tmp/tga181/app.py');s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "1.8.0"')==1
          s=s.replace('APP_VERSION = "1.8.0"','APP_VERSION = "1.8.1"',1).replace('persistent_update_install_v180','persistent_update_install_v181',1)
          start=s.index('def discover_official_product_docs(')
          end=s.index('def universal_docs_from_official_page(',start)
          fn=s[start:end]
          assert "re.search(r'\\\\bsb\\\\s*125\\\\s*a\\\\b',wanted)" in fn
          fn=fn.replace("re.search(r'\\\\bsb\\\\s*125\\\\s*a\\\\b',wanted)","re.search(r'sb[\\s_-]*125[\\s_-]*a(?![a-z0-9])',wanted)")
          fn=fn.replace("candidates.append('https://www.heliosventilatoren.de/at/produkte-at/boxventilatoren/silentbox/sb-125-a-at-09506')","candidates.extend(['https://www.heliosventilatoren.de/de/produkte/boxventilatoren/silentbox/sb-125-a-09506','https://www.heliosventilatoren.de/at/produkte-at/boxventilatoren/silentbox/sb-125-a-at-09506'])")
          assert "sb[\\s_-]*125" in fn
          s=s[:start]+fn+s[end:]
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          scope={}
          exec('import re\\n'+fn.replace('universal_docs_from_official_page(manufacturer,product,model,url)','(url,[{\\'test\\':1}])'),{'clean':lambda x:str(x),'requests':__import__('requests'),'BeautifulSoup':__import__('bs4').BeautifulSoup},scope) if False else None
          assert re.search(r'sb[\s_-]*125[\s_-]*a(?![a-z0-9])','silentbox sb 125 a')
          assert re.search(r'sb[\s_-]*125[\s_-]*a(?![a-z0-9])','sb-125-a')
          Path('/tmp/tga181/version.json').write_text(json.dumps({'version':'1.8.1'})+'\n')
          print('PASS: corrected regex, de+at Helios URLs, syntax')
          
          PY
          (cd /tmp/tga181 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v1.8.1.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v1.8.1.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v1.8.1.zip
          git commit -m 'Build v1.8.1 Helios regex fix'
          git push
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v1.8.1.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'1.8.1','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v1.8.1.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v1.8.1 manifest'
          git pull --rebase origin main
          git push
