name: Inspect v1.5.8 component UI
on:
  push:
    paths:
      - '.github/workflows/repair-v1317.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          unzip -p TGA_Product_Finder_Update_v1.5.8.zip app.py > app_v158_reference.py
          python3 -m py_compile app_v158_reference.py
          git config user.name "TGA Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app_v158_reference.py
          git commit -m "Extract v1.5.8 UI for diagnostic review"
          git push
