name: Publish v1.6.0 variant verification
on:
  push:
    paths:
      - '.github/workflows/repair-v1317.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga160
          unzip -q TGA_Product_Finder_Update_v1.5.9.zip -d /tmp/tga160
          python3 - <<'PY'
          from pathlib import Path
          import json,py_compile
          p=Path('/tmp/tga160/app.py');s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "1.5.9"')==1
          s=s.replace('APP_VERSION = "1.5.9"','APP_VERSION = "1.6.0"',1).replace('persistent_update_install_v159','persistent_update_install_v160',1)
          marker='   if auto:\n'
          assert s.count(marker)>=1
          insert='''   if 'trox' in clean(m).lower() and _search_product=='FKRS-EU':
            st.markdown('**Ausführungsprüfung – FKRS-EU**')
            st.caption('Gemeinsame Herstellerunterlagen können für die Produktfamilie genutzt werden. Die Eignung für die konkret verbaute Ausführung muss separat nachgewiesen werden.')
            _variant=clean(a).upper()
            _overflow=('AA' in _variant.split('/') or 'Z43RM' in _variant or 'ÜBERSTRÖM' in clean(p).upper())
            st.write(f'Verbaute Ausführung laut Excel: **{a or p}**')
            if _overflow:
             st.warning('Überström-Ausführung erkannt: Überströmfunktion, Zubehör AA/Z43RM, Einbausituation und zugehörige Verwendbarkeitsnachweise fachlich prüfen.')
            else:
             st.info('Standardausführung: Einbausituation, Antrieb/Zubehör und Gültigkeitsbereich von DoP, Montageanleitung und Nachweisen prüfen.')
            st.caption('Status: Ausführungsnachweise fachlich offen. Heruntergeladene PDFs gelten nicht automatisch als freigegeben.')
'''
          s=s.replace(marker,insert+marker,1)
          assert s.count('**Ausführungsprüfung – FKRS-EU**')==1
          assert s.count('persistent_update_install_v160')==1
          p.write_text(s,encoding='utf-8');py_compile.compile(str(p),doraise=True)
          Path('/tmp/tga160/version.json').write_text(json.dumps({'version':'1.6.0'},indent=2)+'\n',encoding='utf-8')
          print('PASS: separate variant notice, no automatic approval, syntax valid')
          PY
          (cd /tmp/tga160 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v1.6.0.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v1.6.0.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v1.6.0.zip
          git commit -m 'Build v1.6.0 variant-specific checks'
          git push
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v1.6.0.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'1.6.0','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v1.6.0.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v1.6.0 manifest'
          git push
