name: Publish TGA Product Finder v1.5.2 sidebar update control
on:
  push:
    paths:
      - '.github/workflows/repair-v1317.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate sidebar placement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga152
          unzip -q TGA_Product_Finder_Update_v1.5.1.zip -d /tmp/tga152
          python3 - <<'PY'
          from pathlib import Path
          import json,py_compile,ast
          p=Path('/tmp/tga152/app.py')
          s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "1.5.1"')==1
          s=s.replace('APP_VERSION = "1.5.1"','APP_VERSION = "1.5.2"',1)
          start=s.index('# v1.3.9: dauerhafter Update-Installationsbereich.')
          block=s[start:]
          assert 'key="persistent_update_install_v151"' in block
          assert 'if st.button(' in block
          block=block.replace('if st.button(\n            "Update jetzt installieren"','if st.sidebar.button(\n            "Update jetzt installieren"',1)
          block=block.replace('persistent_update_install_v151','persistent_update_install_v152',1)
          # Den kompletten Updatebereich direkt unter Programmupdates in die linke Leiste setzen.
          s=s[:start]
          marker='# v1.4.0: Projektverwaltung – alte Projekte werden aus Komponenten übernommen.'
          assert s.count(marker)==1
          block=block.replace('st.sidebar.markdown("---")','st.sidebar.markdown("---")\n        st.sidebar.subheader("Programmupdates")',1)
          block=block.replace('st.sidebar.caption(f"Update-Paket: {_update_package_path}")','',1)
          block=block.replace('st.sidebar.success("Update vollständig heruntergeladen und geprüft.")','st.sidebar.success("Update heruntergeladen und geprüft")',1)
          s=s.replace(marker,block+'\n\n'+marker,1)
          assert s.index('persistent_update_install_v152') < s.index(marker)
          assert 'if st.sidebar.button(\n            "Update jetzt installieren"' in s
          assert s.count('Update jetzt installieren')>=1
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          Path('/tmp/tga152/version.json').write_text(json.dumps({'version':'1.5.2'},indent=2)+'\n',encoding='utf-8')
          print('PASS: Python compiles; installation button in sidebar; placement before project content; updater unchanged')
          PY
          (cd /tmp/tga152 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v1.5.2.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v1.5.2.zip
          git config user.name "TGA Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add TGA_Product_Finder_Update_v1.5.2.zip
          git commit -m "Build v1.5.2 sidebar install button"
          git push
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v1.5.2.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'1.5.2','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v1.5.2.zip','sha256':sha}
          open('update_manifest.json','w',encoding='utf-8').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m "Publish immutable v1.5.2 manifest"
          git push
