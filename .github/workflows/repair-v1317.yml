name: Publish TGA Product Finder v1.5.4 sidebar navigation
on:
  push:
    paths:
      - '.github/workflows/repair-v1317.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify navigation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga154
          unzip -q TGA_Product_Finder_Update_v1.5.3.zip -d /tmp/tga154
          python3 - <<'PY'
          from pathlib import Path
          import json,py_compile
          p=Path('/tmp/tga154/app.py')
          s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "1.5.3"')==1
          s=s.replace('APP_VERSION = "1.5.3"','APP_VERSION = "1.5.3"',1)
          s=s.replace('persistent_update_install_v152','persistent_update_install_v154',1)
          # In v1.5.3 the component expanders were accidentally nested inside
          # the "offline PDFs exist" branch. Move them out of that branch.
          marker="st.divider(); st.subheader('Komponenten & Dokumentenmappen')"
          assert s.count(marker)==1, 'Komponentenbereich nicht eindeutig'
          pos=s.index(marker)
          line_start=s.rfind('\n',0,pos)+1
          prefix=s[line_start:pos]
          assert prefix.isspace() and len(prefix)>=2, repr(prefix)
          before=s[:line_start]
          tail=s[line_start:]
          tail=''.join(line[1:] if line.startswith(' ') else line for line in tail.splitlines(keepends=True))
          s=before+tail
          assert "st.expander(f'{m} · {p}'" in s
          # All components are now displayed for the selected project regardless
          # of whether any PDFs have already been downloaded.
          assert s.count("st.sidebar.radio('Bereich öffnen'")==1
          assert s.count("if _tga_page=='📊 Dokumentenübersicht':")==1
          assert s.count('persistent_update_install_v154')==1
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          Path('/tmp/tga154/version.json').write_text(json.dumps({'version':'1.5.3'},indent=2)+'\n',encoding='utf-8')
          print('PASS: Python syntax, sidebar navigation, two page routes, update button retained')
          PY
          (cd /tmp/tga154 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v1.5.4.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v1.5.4.zip
          git config user.name "TGA Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add TGA_Product_Finder_Update_v1.5.4.zip
          git commit -m "Build v1.5.4 sidebar navigation"
          git push
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v1.5.4.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'1.5.3','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v1.5.4.zip','sha256':sha}
          open('update_manifest.json','w',encoding='utf-8').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m "Publish immutable v1.5.4 manifest"
          git push
