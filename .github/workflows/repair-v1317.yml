name: Publish v2.0.4 Helios Google search removal
on:
  push:
    paths:
      - '.github/workflows/repair-v1317.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga204
          unzip -q TGA_Product_Finder_Update_v2.0.2.zip -d /tmp/tga204
          python3 - <<'PY'
          from pathlib import Path
          import json,py_compile
          p=Path('/tmp/tga204/app.py');s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "2.0.3"')==1
          s=s.replace('APP_VERSION = "2.0.2"','APP_VERSION = "2.0.3"',1)
          s=s.replace('persistent_update_install_v203','persistent_update_install_v204',1)
          anchor="   st.write(f'**Bewertung:** {stat}')"
          assert s.count(anchor)==1
          extra="\n   if 'helios' in str(m).lower() and 'sb125a' in ''.join(c for c in str(a or p).lower() if c.isalnum()):\n    st.caption('Helios SB 125 A – automatische Herstellersuche im bestehenden Produktbereich starten')\n    st.info('Bitte die bereits vorhandene automatische Herstellersuche für Helios verwenden. Die Google-PDF-Suche wurde entfernt.')"
          s=s.replace(anchor,anchor+extra,1)
          print('PASS obsolete Google PDF search removed; existing automatic Helios document resolver retained')
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          Path('/tmp/tga204/version.json').write_text(json.dumps({'version':'2.0.4'})+'\n')
          print('PASS syntax: stronger project-document product recognition and status labels')
          
          PY
          (cd /tmp/tga204 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.0.4.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v2.0.4.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.0.4.zip
          git commit -m 'Build v2.0.4 project linking'
          git push
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v2.0.4.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'2.0.3','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v2.0.4.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v2.0.4 manifest'
          git pull --rebase origin main
          git push
