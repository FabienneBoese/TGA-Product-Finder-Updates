name: Publish v2.0.0 project document linking
on:
  push:
    paths:
      - '.github/workflows/repair-v1317.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga200
          unzip -q TGA_Product_Finder_Update_v1.9.1.zip -d /tmp/tga200
          python3 - <<'PY'
          from pathlib import Path
          import json,py_compile
          p=Path('/tmp/tga200/app.py');s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "1.9.1"')==1
          s=s.replace('APP_VERSION = "1.9.1"','APP_VERSION = "2.0.0"',1)
          s=s.replace('persistent_update_install_v191','persistent_update_install_v200',1)
          # Strengthen matching against punctuation variants and require distinguishing evidence.
          old="  hay=norm(name+' '+content[:250000])\\n  for cid,m,p,a in components:\\n   score=0\\n   if len(norm(m))>=4 and norm(m) in hay:score+=25\\n   if len(norm(a))>=5 and norm(a) in hay:score+=65\\n   if len(norm(p))>=7 and norm(p) in hay:score+=35\\n   if score>=60:"
          new="""  hay=norm(name+' '+content[:250000])
  for cid,m,p,a in components:
   manufacturer=norm(m)
   article=norm(a)
   product=norm(p)
   score=0
   manufacturer_found=len(manufacturer)>=4 and manufacturer in hay
   article_found=len(article)>=5 and article in hay
   product_found=len(product)>=7 and product in hay
   if manufacturer_found:score+=25
   if article_found:score+=65
   if product_found:score+=35
   # Article/model match without a matching manufacturer can be ambiguous.
   if not manufacturer_found and not product_found:score=min(score,59)
   if score>=60:"""
          assert s.count(old)==1,'recognition anchor not found'
          s=s.replace(old,new,1)
          # Distinguish exact product evidence from a merely plausible match.
          old_ui="_a.write(_filename+' · '+str(_score)+' % · '+('Zuordnung bestätigt' if _confirmed else 'Zuordnung prüfen'))"
          new_ui="_a.write(_filename+' · '+str(_score)+' % · '+('Zuordnung bestätigt' if _confirmed else ('Produkt eindeutig zugeordnet – Prüfung offen' if _score>=90 else 'Produktfamilie/Zuordnung prüfen')))"
          assert s.count(old_ui)==1
          s=s.replace(old_ui,new_ui,1)
          # Do not auto-approve: preserve confirmed state and existing review process.
          assert 'confirmed=excluded.confirmed' not in s
          print('PASS recognition: manufacturer/model/product evidence, ambiguous model guard, reviewed status retained')
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          Path('/tmp/tga200/version.json').write_text(json.dumps({'version':'2.0.0'})+'\n')
          print('PASS syntax: stronger project-document product recognition and status labels')
          
          PY
          (cd /tmp/tga200 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.0.0.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v2.0.0.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.0.0.zip
          git commit -m 'Build v2.0.0 project linking'
          git push
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v2.0.0.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'2.0.0','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v2.0.0.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v2.0.0 manifest'
          git pull --rebase origin main
          git push
