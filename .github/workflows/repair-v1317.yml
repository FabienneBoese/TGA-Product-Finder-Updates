name: Publish v1.7.3 Helios document host fix
on:
  push:
    paths:
      - '.github/workflows/repair-v1317.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga173
          unzip -q TGA_Product_Finder_Update_v1.7.2.zip -d /tmp/tga173
          python3 - <<'PY'
          from pathlib import Path
          import json,py_compile
          p=Path('/tmp/tga173/app.py');s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "1.7.2"')==1
          s=s.replace('APP_VERSION = "1.7.2"','APP_VERSION = "1.7.3"',1).replace('persistent_update_install_v172','persistent_update_install_v173',1)
          start=s.index('def universal_docs_from_official_page(')
          end=s.index('def find_docs(manufacturer,product):',start)
          fn=s[start:end]
          assert "root=safe_url(url)" in fn
          fn=fn.replace("root=safe_url(url)","root=safe_url(url)\n if root.endswith('.heliosventilatoren.de') or root=='heliosventilatoren.de':root='heliosventilatoren.de'")
          assert "if is_pdf and cat!='Sonstiges' and href not in seen:" in fn
          fn=fn.replace("if is_pdf and cat!='Sonstiges' and href not in seen:","if is_pdf and href not in seen:\n    if cat=='Sonstiges' and any(t in title.lower() for t in ('schaltplan','wiring diagram')):cat='Schaltplan'\n    if cat=='Sonstiges' and any(t in title.lower() for t in ('maßzeichnung','masszeichnung','dimension')):cat='Maßzeichnung'\n    if cat=='Sonstiges' and 'katalog' in title.lower():cat='Katalogseite'\n    if cat=='Sonstiges':continue")
          # Keep confidence below approval threshold, all candidates require review.
          s=s[:start]+fn+s[end:]
          assert s.count("root='heliosventilatoren.de'")==1
          assert s.count("cat='Schaltplan'")==1
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          Path('/tmp/tga173/version.json').write_text(json.dumps({'version':'1.7.3'})+'\n',encoding='utf-8')
          print('PASS syntax, sibling Helios subdomains, model-verified page, PDF document types')
          PY
          (cd /tmp/tga173 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v1.7.3.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v1.7.3.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v1.7.3.zip
          git commit -m 'Build v1.7.3 Helios subdomain fix'
          git push
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v1.7.3.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'1.7.3','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v1.7.3.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v1.7.3 manifest'
          git pull --rebase origin main
          git push
