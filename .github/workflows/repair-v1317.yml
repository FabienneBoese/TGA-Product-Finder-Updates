name: Publish v1.5.9 component UI
on:
  push:
    paths:
      - '.github/workflows/repair-v1317.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga159
          unzip -q TGA_Product_Finder_Update_v1.5.8.zip -d /tmp/tga159
          unzip -p TGA_Product_Finder_Update_v1.5.9.zip app.py > app_v159_reference.py
          python3 -m py_compile app_v159_reference.py

          (cd /tmp/tga159 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v1.5.9.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v1.5.9.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app_v159_reference.py
          git commit -m 'Extract v1.5.9 source for variant checks'
          git push
