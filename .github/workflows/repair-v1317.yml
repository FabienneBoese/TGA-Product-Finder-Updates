name: Publish TGA Product Finder v1.5.1 Excel import fix
on:
  push:
    paths:
      - '.github/workflows/repair-v1317.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test importer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga151
          unzip -q TGA_Product_Finder_Update_v1.5.0.zip -d /tmp/tga151
          python3 - <<'PY'
          from pathlib import Path
          import json,py_compile
          p=Path('/tmp/tga151/app.py')
          s=p.read_text(encoding='utf-8')
          a=s.index('def detect_header(raw):')
          b=s.index('\ndef score(r):',a)
          new='''def detect_header(raw):
           aliases={
            'hersteller': {'hersteller','hersteller/fabrikat','fabrikat'},
            'bezeichnung': {'bezeichnung','produkt/bezeichnung','produkt','produktbezeichnung'},
            'artikelnummer': {'artikelnummer','typ/modell','typ','modell','artikel-nr.','artikel-nr'},
            'gewerk': {'gewerk'}
           }
           def normalize(x):
            return re.sub(r'\\s*[/]\\s*','/',clean(x).lower()).strip(' :')
           for i,row in raw.head(40).iterrows():
            values={normalize(x) for x in row.tolist()}
            if len(values & aliases['bezeichnung'])>=1 and len(values & (aliases['hersteller']|aliases['artikelnummer']))>=1:
             return i
           raise ValueError('Keine passende Kopfzeile gefunden. Erwartet: Produkt/Bezeichnung und Hersteller/Fabrikat oder Typ/Modell.')

          def read_excel(data):
           raw=pd.read_excel(io.BytesIO(data),header=None)
           h=detect_header(raw)
           df=pd.read_excel(io.BytesIO(data),header=h).dropna(axis=1,how='all').dropna(axis=0,how='all')
           aliases={
            'Hersteller':['hersteller','hersteller/fabrikat','fabrikat'],
            'Bezeichnung':['bezeichnung','produkt/bezeichnung','produkt','produktbezeichnung'],
            'Artikelnummer':['artikelnummer','typ/modell','typ','modell','artikel-nr.','artikel-nr'],
            'Gewerk':['gewerk']
           }
           def normalize(x):return re.sub(r'\\s*[/]\\s*','/',clean(x).lower()).strip(' :')
           cols={normalize(c):c for c in df.columns}
           out=pd.DataFrame()
           for target,choices in aliases.items():
            col=next((cols[c] for c in choices if c in cols),None)
            out[target]=df[col].map(clean) if col is not None else ''
           out=out[(out.Hersteller!='')|(out.Bezeichnung!='')].reset_index(drop=True)
           if out.empty:raise ValueError('Keine Produktzeilen gefunden.')
           return out
          '''
          s=s[:a]+new+s[b:]
          s=s.replace('APP_VERSION = "1.5.0"','APP_VERSION = "1.5.1"',1)
          s=s.replace('key="persistent_update_install_v150"','key="persistent_update_install_v151"',1)
          anchor=" c.execute('CREATE TABLE IF NOT EXISTS component_application_groups(component_id INTEGER, group_code TEXT, PRIMARY KEY(component_id,group_code))')"
          if s.count(anchor)!=1:raise RuntimeError('Schema-Anker fehlt')
          s=s.replace(anchor,anchor+"\n try:\n  c.execute('ALTER TABLE components ADD COLUMN gewerk TEXT')\n except Exception as exc:\n  if 'duplicate column name' not in str(exc).lower(): raise",1)
          old="INSERT INTO components(project,manufacturer,product,article_no,confidence,status,docs_searched) VALUES(?,?,?,?,?,?,0)"
          new_sql="INSERT INTO components(project,manufacturer,product,article_no,confidence,status,docs_searched,gewerk) VALUES(?,?,?,?,?,?,0,?)"
          if s.count(old)!=1:raise RuntimeError('INSERT-Anker fehlt')
          s=s.replace(old,new_sql,1)
          old_values="(project,r.Hersteller,r.Bezeichnung,r.Artikelnummer,score(r),status(score(r))))"
          new_values="(project,r.Hersteller,r.Bezeichnung,r.Artikelnummer,score(r),status(score(r)),r.Gewerk))"
          if s.count(old_values)!=1:raise RuntimeError('Werte-Anker fehlt')
          s=s.replace(old_values,new_values,1)
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          Path('/tmp/tga151/version.json').write_text(json.dumps({'version':'1.5.1'},indent=2)+'\n',encoding='utf-8')
          # Echter Importtest mit beiden Spaltenformaten, ohne Streamlit zu starten.
          import ast,io,re
          import pandas as pd
          module=ast.parse(s)
          funcs=[n for n in module.body if isinstance(n,ast.FunctionDef) and n.name in ('clean','detect_header','read_excel')]
          namespace={'pd':pd,'io':io,'re':re}
          exec(compile(ast.Module(body=funcs,type_ignores=[]),'<import-test>','exec'),namespace)
          for data in [
           pd.DataFrame({'Gewerk':['Lüftung'],'Produkt/Bezeichnung':['Brandschutzklappe'],'Hersteller/Fabrikat':['TROX'],'Typ/Modell':['FKRS-EU']}),
           pd.DataFrame({'Hersteller':['TROX'],'Bezeichnung':['Brandschutzklappe'],'Artikelnummer':['FKRS-EU']})
          ]:
           buff=io.BytesIO()
           data.to_excel(buff,index=False)
           out=namespace['read_excel'](buff.getvalue())
           assert len(out)==1 and out.iloc[0]['Hersteller']=='TROX' and out.iloc[0]['Artikelnummer']=='FKRS-EU'
          print('Importtests: beide Excel-Formate erfolgreich')
          PY
          (cd /tmp/tga151 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v1.5.1.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v1.5.1.zip
          git config user.name "TGA Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add TGA_Product_Finder_Update_v1.5.1.zip
          git commit -m "Build v1.5.1 Excel importer"
          git push
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v1.5.1.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'1.5.1','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v1.5.1.zip','sha256':sha}
          open('update_manifest.json','w',encoding='utf-8').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m "Publish immutable v1.5.1 manifest"
          git push
