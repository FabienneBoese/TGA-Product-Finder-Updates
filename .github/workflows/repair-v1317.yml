name: Publish v2.0.5 Helios Google search removal
on:
  push:
    paths:
      - '.github/workflows/repair-v1317.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga205
          unzip -q TGA_Product_Finder_Update_v2.0.3.zip -d /tmp/tga205
          python3 - <<'PY'
          from pathlib import Path
          import json,py_compile
          p=Path('/tmp/tga205/app.py');s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "2.0.4"')==1
          s=s.replace('APP_VERSION = "2.0.3"','APP_VERSION = "2.0.4"',1)
          s=s.replace('persistent_update_install_v204','persistent_update_install_v205',1)
          old="    if st.button('Helios Herstellerseite automatisch auslesen',key=f'helios_extract_{cid}'):"
          assert s.count(old)==1
          s=s.replace(old,"    if st.button('Helios-Dokumente im bestehenden Suchbereich prüfen',key=f'helios_extract_{cid}'):",1)
          start=s.index('     import requests',s.index('Helios-Dokumente im bestehenden Suchbereich prüfen'))
          end=s.index('    for _pdf in st.session_state.get',start)
          s=s[:start]+"     st.info('Helios blockiert den direkten Seitenabruf (HTTP 403). Bitte die vorhandene Herstellersuche und Offline-PDFs verwenden.')\n"+s[end:]
          print('PASS: direct Helios scraper disabled, offline documents preserved')
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          Path('/tmp/tga205/version.json').write_text(json.dumps({'version':'2.0.4'})+'\n')
          print('PASS syntax: stronger project-document product recognition and status labels')
          
          PY
          (cd /tmp/tga205 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.0.5.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v2.0.5.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.0.5.zip
          git commit -m 'Build v2.0.5 project linking'
          git push
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v2.0.5.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'2.0.5','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v2.0.5.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v2.0.5 manifest'
          git pull --rebase origin main
          git push
