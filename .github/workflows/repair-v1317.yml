name: Publish TGA Product Finder v1.5.0
on:
  push:
    paths:
      - '.github/workflows/repair-v1317.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v1.5.0 from verified v1.4.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga150
          unzip -q TGA_Product_Finder_Update_v1.4.0.zip -d /tmp/tga150
          python3 - <<'PY'
          from pathlib import Path
          import json,py_compile
          p=Path('/tmp/tga150/app.py')
          s=p.read_text(encoding='utf-8')
          def change(a,b):
              global s
              if s.count(a)!=1: raise RuntimeError('Text nicht eindeutig gefunden: '+a[:100])
              s=s.replace(a,b,1)
          change('APP_VERSION = "1.4.0"','APP_VERSION = "1.5.0"')
          change('key="persistent_update_install_v140"','key="persistent_update_install_v150"')
          change("'Ampel':docstatus","'Status':docstatus")
          change("x['Ampel'].startswith('🔴')","x['Status'].startswith('🔴')")
          change("Ampel: 🔴 noch nicht bearbeitet","Status: 🔴 noch nicht bearbeitet")
          change('st.title(\'🏗️ TGA Product Finder · Version 1.2.0\')','st.title(f\'🏗️ TGA Product Finder · Version {APP_VERSION}\')')
          change("st.caption('Intelligente Dokumentenmappe · v1.2.0: Reparatur des Windows-Updatepfads')","st.caption('Intelligente Dokumentenmappe · projektbezogene Offline-Dokumente')")
          anchor='''# v1.3.9: dauerhafter Update-Installationsbereich.'''
          if s.count(anchor)!=1: raise RuntimeError('Updatebereich nicht gefunden')
          start=s.index(anchor)
          # Den dauerhaften Installationsknopf innerhalb der linken Seitenleiste anzeigen.
          tail=s[start:]
          tail=tail.replace('''        st.markdown("---")
          st.success("Update vollständig heruntergeladen und geprüft.")
          st.caption(f"Update-Paket: {_update_package_path}")
          if st.button(''','''        st.markdown("---")
          st.success("Update vollständig heruntergeladen und geprüft.")
          st.caption(f"Update-Paket: {_update_package_path}")
          if st.button(''',1)
          # st.sidebar ist ein Container, der auch nach der Definition verwendet werden kann.
          tail=tail.replace('''        st.markdown("---")''','''        st.sidebar.markdown("---")''',1)
          tail=tail.replace('''        st.success("Update vollständig heruntergeladen und geprüft.")''','''        st.sidebar.success("Update vollständig heruntergeladen und geprüft.")''',1)
          tail=tail.replace('''        st.caption(f"Update-Paket: {_update_package_path}")''','''        st.sidebar.caption(f"Update-Paket: {_update_package_path}")''',1)
          tail=tail.replace('''        if st.button(
              "Update jetzt installieren",''','''        if st.sidebar.button(
              "Update jetzt installieren",''',1)
          tail=tail.replace('''                st.success("Windows-Updater wurde direkt gestartet.")''','''                st.sidebar.success("Windows-Updater wurde direkt gestartet.")''',1)
          tail=tail.replace('''                st.info("Bitte das geöffnete Update-Fenster nicht schließen. Die App wird anschließend neu gestartet.")''','''                st.sidebar.info("Bitte das geöffnete Update-Fenster nicht schließen. Die App wird anschließend neu gestartet.")''',1)
          tail=tail.replace('''                st.error(f"Update konnte nicht gestartet werden: {exc}")''','''                st.sidebar.error(f"Update konnte nicht gestartet werden: {exc}")''',1)
          s=s[:start]+tail
          marker=" st.divider(); st.subheader('Komponenten & Dokumentenmappen');"
          if s.count(marker)!=1: raise RuntimeError('Dokumentenabschnitt nicht gefunden')
          section=''' st.divider()
          st.subheader('📁 Offline-Dokumente dieses Projekts')
          st.caption('Nur tatsächlich gespeicherte PDF-Dateien werden hier als offline verfügbar angezeigt. Online-Nachweise bleiben online.')
          _offline_rows=con.execute("SELECT c.manufacturer,c.product,d.doc_type,d.title,d.local_path FROM documents d JOIN components c ON c.id=d.component_id WHERE c.project=? AND d.local_path IS NOT NULL AND d.local_path != '' ORDER BY c.manufacturer,c.product,d.doc_type",(project,)).fetchall()
          _offline_valid=[(m,p,typ,title,path) for m,p,typ,title,path in _offline_rows if os.path.isfile(path)]
          if not _offline_valid:
           st.info('Für dieses Projekt sind noch keine Offline-PDFs gespeichert.')
          else:
           st.success(f'{len(_offline_valid)} Offline-PDF(s) für dieses Projekt vorhanden.')
           for _idx,(_m,_p,_typ,_title,_path) in enumerate(_offline_valid):
            _left,_right=st.columns([4,1])
            _left.write(f'**{_m} · {_p}** – {_typ}: {_title}')
            with open(_path,'rb') as _pdf:
             _right.download_button('PDF öffnen / speichern',data=_pdf.read(),file_name=Path(_path).name,mime='application/pdf',key=f'project_offline_{_idx}_{project}')
          '''
          s=s.replace(marker,section+marker,1)
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          Path('/tmp/tga150/version.json').write_text(json.dumps({'version':'1.5.0'},indent=2)+'\n',encoding='utf-8')
          PY
          (cd /tmp/tga150 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v1.5.0.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v1.5.0.zip
          git config user.name "TGA Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add TGA_Product_Finder_Update_v1.5.0.zip
          git commit -m "Build verified v1.5.0 package"
          git push
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v1.5.0.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'1.5.0','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v1.5.0.zip','sha256':sha}
          open('update_manifest.json','w',encoding='utf-8').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m "Publish immutable v1.5.0 manifest"
          git push
