name: Publish TGA Product Finder v1.5.7 FKRS-EU
on:
  push:
    paths:
      - '.github/workflows/repair-v1317.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate FKRS-EU
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga157
          unzip -q TGA_Product_Finder_Update_v1.5.6.zip -d /tmp/tga157
          python3 - <<'PY'
          from pathlib import Path
          import json,py_compile
          p=Path('/tmp/tga157/app.py')
          s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "1.5.6"')==1
          s=s.replace('APP_VERSION = "1.5.6"','APP_VERSION = "1.5.7"',1)
          s=s.replace('persistent_update_install_v156','persistent_update_install_v157',1)
          # Excel may contain the TROX model in Typ/Modell instead of product name.
          # Only an exact model token can select a safety-critical product family.
          anchor="def resolve_product_page(manufacturer, product):"
          assert s.count(anchor)==1
          helper="""def search_product_for_component(manufacturer,product,model):
           ml=clean(manufacturer).lower()
           if 'trox' not in ml:return product
           import re
           values=[clean(product).upper(),clean(model).upper()]
           hits=set()
           for val in values:
            for code in ('FKRS-EU','FK2-EU','TVE'):
             if re.search(r'(?<![A-Z0-9])'+re.escape(code)+r'(?![A-Z0-9])',val):
              hits.add(code)
           if len(hits)==1:return next(iter(hits))
           return product

          """
          s=s.replace(anchor,helper+anchor,1)
          old="auto=(product_key(m,p) in PRODUCTS and conlit_name_ok)"
          assert s.count(old)==1
          s=s.replace(old,"_search_product=search_product_for_component(m,p,a)\n   auto=(product_key(m,_search_product) in PRODUCTS and conlit_name_ok)",1)
          assert s.count("source,docs=find_docs(m,p)")==1
          s=s.replace("source,docs=find_docs(m,p)","source,docs=find_docs(m,_search_product)",1)
          # No automatic document approval and no changes to stored Excel values.
          assert s.count('search_product_for_component(m,p,a)')==1
          assert s.count('persistent_update_install_v157')==1
          # Test exact and ambiguous model recognition without Streamlit import.
          ns={'clean':lambda x:str(x or '').strip()}
          exec(helper,ns)
          fn=ns['search_product_for_component']
          assert fn('TROX','Brandschutzklappe','FKRS-EU')=='FKRS-EU'
          assert fn('TROX','FKRS.EU','')=='FKRS.EU'
          assert fn('TROX','Brandschutzklappe FKRS-EU','')=='FKRS-EU'
          assert fn('TROX','FK2-EU','FKRS-EU')=='FK2-EU'
          assert fn('ROCKWOOL','Dämmung','FKRS-EU')=='Dämmung'
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          Path('/tmp/tga157/version.json').write_text(json.dumps({'version':'1.5.7'},indent=2)+'\n',encoding='utf-8')
          print('PASS: FKRS-EU manufacturer source enabled, FK2-EU source separate, syntax valid')
          PY
          (cd /tmp/tga157 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v1.5.7.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v1.5.7.zip
          git config user.name "TGA Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add TGA_Product_Finder_Update_v1.5.7.zip
          git commit -m "Build v1.5.7 TROX FKRS-EU source"
          git push
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v1.5.7.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'1.5.7','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v1.5.7.zip','sha256':sha}
          open('update_manifest.json','w',encoding='utf-8').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m "Publish immutable v1.5.7 manifest"
          git push
