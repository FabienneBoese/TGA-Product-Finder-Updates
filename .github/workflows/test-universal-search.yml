name: Universal TGA product search tests
on:
  push:
    paths:
      - 'research/universal_product_search.py'
      - 'research/manufacturer_sitemap_provider.py'
      - 'tests/test_universal_product_search.py'
      - 'tests/test_manufacturer_sitemap_provider.py'
      - '.github/workflows/test-universal-search.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q requests
      - run: python -m unittest discover -s tests -p 'test_universal_product_search.py' -v
      - run: python -m unittest discover -s tests -p 'test_manufacturer_sitemap_provider.py' -v
      - run: python -m compileall -q research/universal_product_search.py research/manufacturer_sitemap_provider.py
