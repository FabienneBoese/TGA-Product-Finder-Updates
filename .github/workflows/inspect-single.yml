name: Inspect single product integration
on:
  push:
    paths: ['.github/workflows/inspect-single.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import zipfile,ast
          from pathlib import Path
          with zipfile.ZipFile('TGA_Product_Finder_Update_v2.3.30.zip') as z:
              s=z.read('app.py').decode()
          lines=s.splitlines()
          out=[]
          for i,line in enumerate(lines):
              if any(x in line for x in ('def _tga_bulk_candidates','def _tga_research_online','_tga_bulk_candidates(','_tga_research_online(','def _tga_bulk_')):
                  out.append('==== line '+str(i+1)+' ====')
                  out.extend(f'{j+1}: {lines[j]}' for j in range(max(0,i-5),min(len(lines),i+95)))
          Path('research/integration_inspection.txt').write_text('\n'.join(out))
          PY
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/integration_inspection.txt
          git commit -m 'Capture app integration entry points'
          git pull --rebase origin main
          git push origin HEAD:main
