name: Test authorized manufacturer data access
on:
  push:
    paths: ['.github/workflows/test-authorized-manufacturer-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install catalog/XML dependencies
        run: python -m pip install -q requests defusedxml
      - name: Test machine-to-machine adapters and permission checks
        run: |
          python -m unittest discover -s tests -p 'test_authorized_manufacturer_sources.py' -v
      - name: Verify explicit status without partner credentials
        run: |
          python research/authorized_manufacturer_sources.py
