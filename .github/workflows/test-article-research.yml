name: Test Hersteller-Recherche
on:
  push:
    paths:
      - 'research/test_headless_article_research.py'
      - 'research/headless_article_research.py'
      - 'research/manufacturer_domain_resolver.py'
      - 'research/test_manufacturer_domain_resolver.py'
      - 'research/manufacturer_page_finder.py'
      - 'research/test_manufacturer_page_finder.py'
      - '.github/workflows/test-article-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q requests beautifulsoup4
      - run: python -m unittest discover -s research -p 'test_*.py' -v
