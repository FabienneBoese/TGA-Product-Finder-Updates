name: Build universal identity 2317
on:
  push:
    paths: ['.github/workflows/build-universal2317.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          mkdir /tmp/tga
          unzip -q TGA_Product_Finder_Update_v2.3.16.zip -d /tmp/tga
          cat > /tmp/tga/product_identity_engine.py <<'PY'
          """Manufacturer-neutral parsing. Detection never implies manufacturer verification."""
          import re
          from dataclasses import dataclass,asdict
          @dataclass
          class Identity:
              manufacturer:str
              family:str
              model:str
              dimension:str
              article_candidate:str
              article_status:str
              level:str
          DIM=re.compile(r'(?<!\w)(?:DN\s*\d{1,4}|(?:Ø|ø)\s*\d+(?:[.,]\d+)?|\d{1,3}(?:[.,]\d+)?\s*[x×]\s*\d{1,3}(?:[.,]\d+)?|\d{1,3}\s*mm)(?!\w)',re.I)
          EXPLICIT=re.compile(r'\b(?:Artikel(?:nummer|nr\.)?|Art\.?\s*Nr\.?|Bestell(?:nummer|nr\.)?|Order\s*(?:No|Number)|EAN)\s*[:#-]?\s*([A-Z0-9][A-Z0-9._/-]{3,24})',re.I)
          def analyze(manufacturer,product,model='',article_no='',verified=False):
              manufacturer=str(manufacturer or '').strip()
              product=str(product or '').strip()
              model=str(model or '').strip()
              raw=str(article_no or '').strip()
              dim=DIM.search(' '.join((product,model)))
              match=EXPLICIT.search(' '.join((product,model)))
              candidate=raw or (match.group(1) if match else '')
              if candidate and not re.fullmatch(r'[A-Z0-9][A-Z0-9._/-]{3,24}',candidate,re.I):
                  candidate=''
              # A type such as FK2-EU or SB-125-A is not promoted to an article number.
              status='verifiziert' if candidate and verified else ('Kandidat – Herstellerprüfung erforderlich' if candidate else 'keine Artikelnummer bestätigt')
              family=EXPLICIT.sub('',product).strip(' ,-;')
              level='Einzelartikel' if candidate and verified else ('Variante / Typ' if model or dim else 'Produktfamilie / System')
              return Identity(manufacturer,family,model,dim.group(0) if dim else '',candidate,status,level)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import ast,json
          p=Path('/tmp/tga/app.py')
          s=p.read_text().replace('APP_VERSION = "2.3.16"','APP_VERSION = "2.3.17"',1)
          anchor="  st.caption('Dokumentationsgruppe je Produkt direkt auswählen:')"
          assert s.count(anchor)==1
          addon="""  from product_identity_engine import analyze as _analyze_product_identity
           with st.expander('Universelle Produkterkennung – Diagnose',expanded=False):
            st.caption('Artikelnummern-Kandidaten werden nicht ohne Herstellerprüfung bestätigt.')
            _ident_rows=[]
            for _cid,_maker,_prod,_article,_model in con.execute('SELECT id,manufacturer,product,article_no,model_type FROM components WHERE project=? ORDER BY id',(project,)).fetchall():
             _ident=_analyze_product_identity(_maker,_prod,_model,_article,verified=bool(_article))
             _ident_rows.append({'ID':_cid,'Hersteller':_ident.manufacturer,'Produktfamilie':_ident.family,'Typ / Modell':_ident.model,'Dimension':_ident.dimension,'Artikelnummer-Kandidat':_ident.article_candidate,'Prüfstatus':_ident.article_status,'Ebene':_ident.level})
            st.dataframe(_ident_rows,hide_index=True,width='stretch',height=max(250,min(900,38*(len(_ident_rows)+1))))
          """
          s=s.replace(anchor,addon.rstrip()+'\n'+anchor,1)
          ast.parse(s)
          p.write_text(s)
          v=Path('/tmp/tga/version.json');d=json.loads(v.read_text());d['version']='2.3.17';v.write_text(json.dumps(d))
          print('PASS syntax')
          PY
          PYTHONPATH=/tmp/tga python3 - <<'PY'
          from product_identity_engine import analyze
          cases=[
           ('TROX','FK2-EU','','','Produktfamilie / System',''),
           ('Geberit','Mapress Therm DN 20','','','Variante / Typ','DN 20'),
           ('GROHE','Eurosmart CE','36332000','','Variante / Typ',''),
           ('Helios','SilentBox','SB-125-A','','Variante / Typ',''),
           ('ROCKWOOL','Conlit 150 U 50 mm','','','Variante / Typ','50 mm'),
           ('Beispielhersteller','Armatur Art.-Nr. 12345678','','','Produktfamilie / System','')]
          for m,p,t,a,level,dim in cases:
           x=analyze(m,p,t,a)
           assert x.level==level,(m,x)
           assert x.dimension==dim,(m,x)
           assert x.article_status!='verifiziert',(m,x)
          assert analyze('Test','Pumpe','', '12345678').article_status=='Kandidat – Herstellerprüfung erforderlich'
          assert analyze('Test','Pumpe','', '12345678',verified=True).level=='Einzelartikel'
          print('PASS six cross-manufacturer cases, conservative article classification')
          PY
          python3 -m pip install -q streamlit pandas openpyxl requests beautifulsoup4 pypdf
          TGA_DATA_DIR=/tmp/tga_test python3 - <<'PY'
          import os,sqlite3
          from streamlit.testing.v1 import AppTest
          os.chdir('/tmp/tga')
          a=AppTest.from_file('app.py',default_timeout=45).run()
          assert not a.exception,a.exception
          c=sqlite3.connect('/tmp/tga_test/tga_finder.db')
          for m,p in [('TROX','FK2-EU'),('Geberit','Mapress Therm DN 20'),('GROHE','Eurosmart CE')]:
           c.execute("INSERT INTO components(project,manufacturer,product,confidence,status,docs_searched) VALUES('Testprojekt',?,?,90,'Prüfen',0)",(m,p))
          c.commit()
          a.radio[0].set_value('📊 Dokumentenübersicht').run()
          assert not a.exception,a.exception
          assert any('Universelle Produkterkennung' in x.label for x in a.expander)
          print('PASS Streamlit integration')
          PY
          (cd /tmp/tga && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.3.17.zip" app.py version.json product_identity_engine.py TGA_Updater.ps1)
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.3.17.zip
          git commit -m 'Release universal product identity diagnostic 2.3.17'
          git pull --rebase origin main
          git push origin HEAD:main
