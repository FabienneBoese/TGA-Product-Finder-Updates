name: Publish v2.3.4 Helios Auto Identification
on:
  push:
    paths: ['.github/workflows/publish-v234.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga234
          unzip -q TGA_Product_Finder_Update_v2.3.3.zip -d /tmp/tga234
          python3 - <<'PY'
          from pathlib import Path
          import ast,py_compile,json,re
          p=Path('/tmp/tga234/app.py')
          s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "2.3.3"')==1
          s=s.replace('APP_VERSION = "2.3.3"','APP_VERSION = "2.3.4"',1)
          # v2.3.3 already enriches the database before constructing the overview.
          # Remove the obsolete manual-confirmation widget without changing other controls.
          lines=s.splitlines(keepends=True)
          button=next(i for i,line in enumerate(lines) if "if st.button('Artikelnummer 09506 übernehmen'" in line)
          base=len(lines[button])-len(lines[button].lstrip())
          stop=button+1
          while stop<len(lines) and (not lines[stop].strip() or len(lines[stop])-len(lines[stop].lstrip())>base):
           stop+=1
          del lines[button:stop]
          s=''.join(lines)
          assert 'helios_official_article(_hm,_hp,_ht,_ha)' in s
          assert "UPDATE components SET article_no=?" in s
          assert "'Artikelnummer':oa or '—'" in s
          assert "Dokumentationsumfang festlegen" in s
          assert "Artikelnummer 09506 übernehmen" not in s
          ast.parse(s)
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          v=Path('/tmp/tga234/version.json')
          data=json.loads(v.read_text(encoding='utf-8'));data['version']='2.3.4'
          v.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PASS: Helios identifier tests')
          PY
          python3 -m pip install -q streamlit pandas openpyxl requests beautifulsoup4 pypdf
          python3 - <<'PY'
          import os
          from streamlit.testing.v1 import AppTest
          os.chdir('/tmp/tga234')
          at=AppTest.from_file('app.py',default_timeout=35).run()
          assert not at.exception,at.exception
          print('PASS: Streamlit AppTest')
          PY
          (cd /tmp/tga234 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.3.4.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v2.3.4.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.3.4.zip
          git commit -m 'Build v2.3.4 Helios'
          git pull --rebase origin main
          git push origin HEAD:main
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v2.3.4.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'2.3.4','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v2.3.4.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v2.3.4'
          git pull --rebase origin main
          git push origin HEAD:main
