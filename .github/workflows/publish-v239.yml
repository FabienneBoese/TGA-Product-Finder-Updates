name: Publish v2.3.9 Overview Crash Fix
on:
  push:
    paths: ['.github/workflows/publish-v239.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, regression test, publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga239
          unzip -q TGA_Product_Finder_Update_v2.3.8.zip -d /tmp/tga239
          python3 - <<'PY'
          from pathlib import Path
          import ast,py_compile,json,re
          p=Path('/tmp/tga239/app.py')
          s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "2.3.8"')==1
          s=s.replace('APP_VERSION = "2.3.8"','APP_VERSION = "2.3.9"',1)
          # Manufacturer-neutral article recovery from explicit original source values.
          marker='def db():'
          assert s.count(marker)==1
          helper=chr(10).join([
           'def recover_explicit_article(manufacturer, product, model_type, article_no, identifier_source, product_family):',
           ' import re',
           ' if str(article_no or "").strip() or str(product_family or "").strip(): return None',
           ' raw=str(identifier_source or "").strip()',
           ' if not raw: return None',
           ' # Only an explicitly labelled part number or a standalone manufacturer number qualifies.',
           ' label=re.fullmatch(r"(?:artikel(?:nummer|[- ]?nr\\.?)|art\\.?[- ]?nr\\.?|bestell(?:nummer|[- ]?nr\\.?))\\s*[:#-]?\\s*(\\d{5,12}|\\d{3}(?:\\.\\d{1,3}){2,3})",raw,re.I)',
           ' candidate=label.group(1) if label else raw if re.fullmatch(r"\\d{5,12}|\\d{3}(?:\\.\\d{1,3}){2,3}",raw) else None',
           ' if not candidate: return None',
           ' # A bare digit model is ambiguous when identical to the explicit type.',
           ' if re.sub(r"\\W","",candidate)==re.sub(r"\\W","",str(model_type or "")): return None',
           ' return candidate',
           '',
          ])+chr(10)
          s=s.replace(marker,helper+marker,1)
          # Run recovery on existing projects in the overview, not just during imports.
          needle="  rows=con.execute(\"SELECT id,manufacturer,product,article_no,confidence,status,docs_searched FROM components WHERE project=? ORDER BY id\",(project,)).fetchall()"
          matches=[line for line in s.splitlines() if 'rows=con.execute' in line and 'SELECT id,manufacturer,product,article_no,confidence,status,docs_searched' in line]
          matches=[line for line in matches if line.lstrip().startswith('rows=')]
          assert len(matches)==1,matches
          needle=matches[0]
          enrichment=chr(10).join([
           '  _article_rows=con.execute("SELECT id,manufacturer,product,model_type,article_no,identifier_source,product_family FROM components WHERE project=?",(project,)).fetchall()',
           '  for _aid,_am,_ap,_at,_an,_as,_af in _article_rows:',
           '   _recovered=recover_explicit_article(_am,_ap,_at,_an,_as,_af)',
           '   if _recovered:',
           '    con.execute("UPDATE components SET article_no=? WHERE id=? AND (article_no IS NULL OR TRIM(article_no)=\'\')",(_recovered,_aid))',
           '  con.commit()',
           ''
          ])+chr(10)
          indentation=needle[:len(needle)-len(needle.lstrip())]
          enrichment=''.join(indentation+line.lstrip()+chr(10) if line.startswith('  _article_rows=') or line.startswith('  for _aid,') or line.startswith('  con.commit()') else indentation+' '+line.lstrip()+chr(10) if line.startswith('   _recovered=') or line.startswith('   if _recovered:') else indentation+'  '+line.lstrip()+chr(10) for line in enrichment.splitlines() if line.strip())
          s=s.replace(needle,enrichment+needle,1)
          ls=s.splitlines(keepends=True)
          idx=next(i for i,l in enumerate(ls) if '_scope_item=_scope_map[_scope_label]' in l)
          ind=ls[idx][:len(ls[idx])-len(ls[idx].lstrip())]
          ls.insert(idx,ind+'_scope_label=_selected_label if _selected_label in _scope_map else next(iter(_scope_map))'+chr(10))
          s=''.join(ls)
          ast.parse(s)
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          ns={}
          exec(compile(ast.Module(body=[n for n in ast.parse(s).body if isinstance(n,ast.FunctionDef) and n.name=='recover_explicit_article'],type_ignores=[]),'<recovery>','exec'),ns)
          f=ns['recover_explicit_article']
          print('TEST1',f('Geberit','Renova Plan','','','Artikelnummer: 501.632.00.1',''))
          print('TEST2',f('GROHE','Armatur','','','Art.-Nr. 36327001',''))
          print('TEST3',f('Helios','Ventilatorbox','SB 125 A','','Bestellnummer 09506',''))
          assert f('Geberit','Renova Plan','', '', 'Artikelnummer: 501.632.00.1','')=='501.632.00.1'
          assert f('GROHE','Armatur','','','Art.-Nr. 36327001','')=='36327001'
          assert f('Helios','Ventilatorbox','SB 125 A','','Bestellnummer 09506','')=='09506'
          assert f('TROX','Brandschutzklappe','FK2-EU','','FK2-EU','') is None
          assert f('ROCKWOOL','Conlit 150 U','','','150','') is None
          assert f('GROHE','Eurosmart CE','','','36327001','Eurosmart CE') is None
          assert f('Geberit','Renova Plan','','99999999','501.632.00.1','') is None
          print('PASS: explicit manufacturer identifiers restored; type/family/conflict guarded')
          v=Path('/tmp/tga239/version.json')
          data=json.loads(v.read_text(encoding='utf-8'));data['version']='2.3.9'
          v.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python3 -m pip install -q streamlit pandas openpyxl requests beautifulsoup4 pypdf
          TGA_DATA_DIR=/tmp/tga239_test_data python3 - <<'PY'
          import os,sqlite3
          from streamlit.testing.v1 import AppTest
          os.chdir('/tmp/tga239')
          at=AppTest.from_file('app.py',default_timeout=45).run()
          assert not at.exception,at.exception
          db=sqlite3.connect('/tmp/tga239_test_data/tga_finder.db')
          fixtures=[
           ('Helios','Ventilatorbox','SB 125 A','','', ''),
           ('Geberit','Renova Plan','','','Artikelnummer: 501.632.00.1',''),
           ('GROHE','Armatur','','','Art.-Nr. 36327001',''),
           ('TROX','Brandschutzklappe','FK2-EU','','FK2-EU',''),
           ('GROHE','Eurosmart CE','','','36327001','Eurosmart CE')]
          db.executemany("INSERT INTO components(project,manufacturer,product,model_type,article_no,identifier_source,product_family,confidence,status,docs_searched) VALUES('Testprojekt',?,?,?,?,?,?,90,'Prüfen',0)",fixtures)
          db.commit()
          at.radio[0].set_value('📊 Dokumentenübersicht').run()
          assert not at.exception,at.exception
          found=db.execute("SELECT manufacturer,product,article_no FROM components ORDER BY id").fetchall()
          assert [x[2] for x in found]==['09506','501.632.00.1','36327001','',''],found
          assert len(at.dataframe[0].value)==5
          print('PASS: actual overview recovered 3 verified/explicit article numbers without guessing TROX/family',found)
          at.session_state['doc_overview_selection']={'selection':{'rows':[2]}}
          at.run()
          assert not at.exception,at.exception
          assert any('GROHE' in x.value and 'Ausgewähltes Produkt:' in x.value for x in at.caption)
          at.session_state['doc_overview_selection']={'selection':{'rows':[3]}}
          at.run()
          assert not at.exception,at.exception
          assert any('TROX' in x.value and 'Ausgewähltes Produkt:' in x.value for x in at.caption)
          print('PASS: UI row switching GROHE to TROX')
          PY
          (cd /tmp/tga239 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.3.9.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v2.3.9.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.3.9.zip
          git commit -m 'Build v2.3.9 overview crash fix'
          git pull --rebase origin main
          git push origin HEAD:main
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v2.3.9.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'2.3.9','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v2.3.9.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v2.3.9'
          git pull --rebase origin main
          git push origin HEAD:main
