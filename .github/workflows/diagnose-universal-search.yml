name: Diagnose Suchindex-Produktabdeckung
on:
  push:
    paths:
      - '.github/workflows/diagnose-universal-search.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q requests
      - run: python research/diagnose_universal_search.py
