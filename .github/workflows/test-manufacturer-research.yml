name: Manufacturer research regression tests
on:
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/test-manufacturer-research.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python -m compileall -q research
      - run: python -m unittest discover -s research -p 'test_manufacturer*.py' -v
