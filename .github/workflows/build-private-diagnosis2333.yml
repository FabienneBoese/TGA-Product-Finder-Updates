name: Build private diagnosis 2333
on:
  push:
    paths: ['.github/workflows/build-private-diagnosis2333.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          python3 -m pip install -q streamlit pandas openpyxl requests beautifulsoup4 pypdf
          python3 -m unittest discover -s research -p 'test_private_diagnosis_upload.py' -v
          mkdir -p /tmp/tga2333
          unzip -q TGA_Product_Finder_Update_v2.3.32.zip -d /tmp/tga2333
          python3 research/build_private_diagnosis2333.py
          TGA_DATA_DIR=/tmp/tga2333_data python3 - <<'PY'
          import os
          from streamlit.testing.v1 import AppTest
          os.chdir('/tmp/tga2333')
          app=AppTest.from_file('app.py',default_timeout=45).run()
          assert not app.exception,app.exception
          print('PASS Streamlit startup')
          PY
          (cd /tmp/tga2333 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.3.33.zip" app.py version.json TGA_Updater.ps1)
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('TGA_Product_Finder_Update_v2.3.33.zip')
          Path('update_manifest.json').write_text(json.dumps({'version':'2.3.33','download_url':'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/main/TGA_Product_Finder_Update_v2.3.33.zip','sha256':hashlib.sha256(p.read_bytes()).hexdigest()},indent=2))
          PY
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.3.33.zip update_manifest.json
          git commit -m 'Release opt-in private diagnosis export v2.3.33'
          git pull --rebase origin main
          git push origin HEAD:main
