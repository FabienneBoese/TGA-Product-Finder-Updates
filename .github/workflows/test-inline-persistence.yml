name: Test inline editor persistence
on:
  push:
    paths: ['.github/workflows/test-inline-persistence.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          mkdir /tmp/app
          unzip -q TGA_Product_Finder_Update_v2.3.14.zip -d /tmp/app
          python3 -m pip install -q streamlit pandas openpyxl requests beautifulsoup4 pypdf playwright
          python3 -m playwright install chromium >/dev/null
          cat > /tmp/test_ui.py <<'PY'
          import os,sqlite3,subprocess,time,urllib.request
          from playwright.sync_api import sync_playwright
          env=os.environ.copy();env['TGA_DATA_DIR']='/tmp/tga_multi_test'
          p=subprocess.Popen(['python3','-m','streamlit','run','/tmp/app/app.py','--server.headless=true','--server.port=8501','--server.address=127.0.0.1'],env=env,stdout=open('/tmp/server.log','w'),stderr=subprocess.STDOUT)
          try:
           for i in range(50):
            try:urllib.request.urlopen('http://127.0.0.1:8501',timeout=2);break
            except Exception:time.sleep(1)
           with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True,args=['--no-sandbox'])
            page=browser.new_page(viewport={'width':1600,'height':1000})
            page.goto('http://127.0.0.1:8501')
            page.wait_for_timeout(1800)
            db=sqlite3.connect('/tmp/tga_multi_test/tga_finder.db')
            cases=[('Geberit','Mapress Therm','Systemrohr'),('GROHE','Eurosmart CE','Abweichende Nachweise'),('ROCKWOOL','Conlit 150 U','Allgemeine Unterlagen'),('Helios','SilentBox','Abweichende Nachweise')]
            for maker,product,variant in cases:
             db.execute('DELETE FROM components')
             db.execute("INSERT INTO components(project,manufacturer,product,confidence,status,docs_searched) VALUES('Testprojekt',?,?,90,'Prüfen',0)",(maker,product))
             db.commit()
             page.reload();page.wait_for_timeout(1600)
             page.locator('[data-testid="stSidebar"] label').filter(has_text='Dokumentenübersicht').first.click(timeout=15000)
             page.wait_for_timeout(1700)
             assert page.get_by_text('Dokumentationsgruppe',exact=False).count()>0,(maker,'missing editor')
             grid=page.locator('[data-testid="stDataFrame"]').first
             grid.click(position={'x':200,'y':58},timeout=10000)
             page.keyboard.press('Control+End')
             page.keyboard.press('Enter')
             if not page.locator('[role="option"]').count():
              page.keyboard.press('Escape')
              grid.click(position={'x':200,'y':58},timeout=10000)
              page.keyboard.press('End')
              page.keyboard.press('Enter')
             if not page.locator('[role="option"]').count():
              page.keyboard.press('Escape')
              grid.click(position={'x':200,'y':58},timeout=10000)
              for _ in range(25):page.keyboard.press('ArrowRight')
              page.keyboard.press('Enter')
             print('OPTIONS',maker,page.locator('[role="option"]').all_text_contents(),flush=True)
             page.get_by_role('option',name=variant,exact=True).click(timeout=8000)
             page.wait_for_timeout(1300)
             saved=db.execute('SELECT doc_variant,article_no FROM components WHERE manufacturer=?',(maker,)).fetchone()
             assert saved and saved[0]==variant,(maker,saved)
             assert not saved[1],(maker,'article changed',saved)
             page.reload();page.wait_for_timeout(1500)
             page.locator('[data-testid="stSidebar"] label').filter(has_text='Dokumentenübersicht').first.click(timeout=15000)
             page.wait_for_timeout(900)
             persisted=db.execute('SELECT doc_variant FROM components WHERE manufacturer=?',(maker,)).fetchone()[0]
             assert persisted==variant,(maker,persisted)
             print('PASS',maker,product,variant,'saved and retained after reload',flush=True)
            browser.close()
          finally:p.terminate()
          PY
          python3 /tmp/test_ui.py
