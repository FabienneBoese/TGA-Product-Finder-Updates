name: Activate inline 2314
on:
  push:
    paths: ['.github/workflows/activate-inline2314.yml']
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('TGA_Product_Finder_Update_v2.3.14.zip')
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          d={'version':'2.3.14','download_url':'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/REPLACE_COMMIT/TGA_Product_Finder_Update_v2.3.14.zip','sha256':sha}
          Path('update_manifest.json').write_text(json.dumps(d,indent=2))
          PY
          COMMIT=$(git log -1 --format=%H -- TGA_Product_Finder_Update_v2.3.14.zip)
          sed -i "s/REPLACE_COMMIT/$COMMIT/" update_manifest.json
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add update_manifest.json
          git commit -m 'Activate 2.3.14'
          git push
