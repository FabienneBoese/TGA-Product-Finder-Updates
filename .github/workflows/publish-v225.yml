name: Publish TGA Product Finder v2.2.5 Recognition Integrity (Retry)
on:
  push:
    paths: ['.github/workflows/publish-v225.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga225
          unzip -q TGA_Product_Finder_Update_v2.2.4.zip -d /tmp/tga225
          python3 - <<'PY'
          from pathlib import Path
          import ast,py_compile,re
          p=Path('/tmp/tga225/app.py')
          s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "2.2.4"')==1
          s=s.replace('APP_VERSION = "2.2.4"','APP_VERSION = "2.2.5"',1)
          # Keep an audit trail of the originally supplied Excel identifier.
          anchor=next(line for line in s.splitlines() if "if 'model_type' not in ccols:" in line)
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+"\n  if 'identifier_source' not in ccols: c.execute('ALTER TABLE components ADD COLUMN identifier_source TEXT DEFAULT \"\"')\n  if 'product_family' not in ccols: c.execute('ALTER TABLE components ADD COLUMN product_family TEXT DEFAULT \"\"')",1)
          # Before any automatic migration, save original value. Do not discard families.
          anchor="  for _cid,_maker,_product,_article,_model in c.execute('SELECT id,manufacturer,product,article_no,model_type FROM components').fetchall():"
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+"\n   if str(_article or '').strip():\n    c.execute('UPDATE components SET identifier_source=? WHERE id=? AND COALESCE(identifier_source,\'\')=\'\'',(_article,_cid))",1)
          old="if _kind=='family' and str(_article or '').strip():\n   c.execute('UPDATE components SET article_no=? WHERE id=?',('',_cid))"
          assert s.count(old)==1
          new="if _kind=='family' and str(_article or '').strip():\n   c.execute('UPDATE components SET product_family=?,article_no=? WHERE id=?',(_article,'',_cid))"
          s=s.replace(old,new,1)
          # Family value from Excel must be saved, not silently thrown away.
          insert="con.execute('INSERT INTO components(project,manufacturer,product,article_no,model_type,confidence,status,docs_searched,gewerk) VALUES(?,?,?,?,?,?,?,0,?)',(project,r.Hersteller,r.Bezeichnung,_final_article,_final_type,score(r),status(score(r)),r.Gewerk))"
          assert s.count(insert)==1
          s=s.replace(insert,insert+"\n      con.execute('UPDATE components SET identifier_source=?,product_family=? WHERE id=?',(clean(r.Artikelnummer),clean(r.Artikelnummer) if _kind=='family' else '',con.execute('SELECT last_insert_rowid()').fetchone()[0]))",1)
          # A confirmed manufacturer product label is not proof of a specific variant.
          anchor="overview.append({'Status':docstatus.split()[0]"
          assert s.count(anchor)==1
          a=s.index(anchor);b=s.index(chr(10),a)
          line=s[a:b]
          assert "'Produktidentifikation':'Herstellerprüfung offen' if not _name_ok else 'Herstellerbezeichnung bestätigt'" in line
          line=line.replace("'Produktidentifikation':'Herstellerprüfung offen' if not _name_ok else 'Herstellerbezeichnung bestätigt'","'Produktidentifikation':('Herstellerbezeichnung bestätigt; Variante prüfen' if _name_ok else 'Herstellerprüfung offen')")
          line=line.replace("'Artikelnummer':oa or '—'","'Artikelnummer':oa or '—','Produktfamilie':(con.execute('SELECT product_family FROM components WHERE id=?',(ocid,)).fetchone()[0] or '—')")
          s=s[:a]+line+s[b:]
          # A 100% field completeness score must not be presented as verified identity.
          s=s.replace("k2.metric('≥95 % erkannt',auto_ok)","k2.metric('≥95 % Datenfelder',auto_ok)",1)
          s=s.replace("k3.metric('Bestätigung nötig',need_confirm)","k3.metric('Datenfelder unter 95 %',need_confirm)",1)
          ast.parse(s)
          assert "identifier_source" in s and "product_family" in s
          assert "Herstellerbezeichnung bestätigt; Variante prüfen" in s
          assert "≥95 % Datenfelder" in s
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          # Real migration and import integration test against SQLite, no Streamlit needed.
          tree=ast.parse(s)
          selected=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name in ('classify_component_identifier','db')]
          import sqlite3,tempfile,os
          namespace={'sqlite3':sqlite3,'DB':tempfile.mktemp(suffix='.sqlite'),'os':os,'re':re}
          exec(compile(ast.Module(body=selected,type_ignores=[]),'<integration>','exec'),namespace)
          con=namespace['db']()
          con.execute("INSERT INTO components(project,manufacturer,product,article_no,confidence,status) VALUES('T','Reflex','Systemtrenner','Fillset Compact Twin',100,'Automatisch prüfbar')")
          con.execute("INSERT INTO components(project,manufacturer,product,article_no,confidence,status) VALUES('T','WIKA','Manometer','111.10 NG 63',100,'Automatisch prüfbar')")
          con.execute("INSERT INTO components(project,manufacturer,product,article_no,confidence,status) VALUES('T','Geberit','Renova','501.632.00.1',100,'Automatisch prüfbar')")
          con.commit();con.close()
          con=namespace['db']()
          rows=con.execute('SELECT manufacturer,article_no,model_type,identifier_source,product_family FROM components ORDER BY id').fetchall()
          assert rows[0][1]=='' and rows[0][3]=='Fillset Compact Twin' and rows[0][4]=='Fillset Compact Twin',rows
          assert rows[1][1]=='' and rows[1][2]=='111.10 NG 63' and rows[1][3]=='111.10 NG 63',rows
          assert rows[2][1]=='501.632.00.1' and rows[2][3]=='501.632.00.1',rows
          con.close();os.unlink(namespace['DB'])
          print('PASS: SQLite migration retains original identifier, family and actual article number')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/tga225/version.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['version']='2.2.5'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python3 -m pip install -q --disable-pip-version-check streamlit pandas openpyxl requests beautifulsoup4 pypdf
          python3 - <<'PY'
          from streamlit.testing.v1 import AppTest
          import os
          os.chdir('/tmp/tga225')
          at=AppTest.from_file('app.py',default_timeout=35).run()
          assert not at.exception,at.exception
          print('PASS: Streamlit AppTest')
          PY
          (cd /tmp/tga225 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.2.5.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v2.2.5.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.2.5.zip
          git commit -m 'Build v2.2.5 recognition integrity'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v2.2.5.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'2.2.5','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v2.2.5.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v2.2.5 manifest'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
