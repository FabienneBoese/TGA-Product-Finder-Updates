name: Hersteller-Sitemap-Pilot
on:
  push:
    paths: ['.github/workflows/diagnose-sitemaps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q requests
      - run: python research/diagnose_sitemaps.py
