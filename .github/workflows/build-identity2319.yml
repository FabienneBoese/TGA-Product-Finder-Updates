name: Build identity audit 2319
on:
  push:
    paths: ['.github/workflows/build-identity2319.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          mkdir /tmp/tga
          unzip -q TGA_Product_Finder_Update_v2.3.18.zip -d /tmp/tga
          python3 - <<'PY'
          from pathlib import Path
          import ast,json
          p=Path('/tmp/tga/app.py');s=p.read_text()
          s=s.replace('APP_VERSION = "2.3.18"','APP_VERSION = "2.3.19"',1)
          s=s.replace("status='verifiziert' if candidate and verified else ('Kandidat – Herstellerprüfung erforderlich' if candidate else 'keine Artikelnummer bestätigt')","status='aus Bestandsdaten – Quellenprüfung offen' if candidate and verified else ('Kandidat – Herstellerprüfung erforderlich' if candidate else 'keine Artikelnummer bestätigt')",1)
          s=s.replace("level='Einzelartikel' if candidate and verified else ('Variante / Typ' if model or dim else 'Produktfamilie / System')","level='Einzelartikel (vorläufig)' if candidate and verified else ('Variante / Typ' if model or dim else 'Produktfamilie / System')",1)
          anchor="            st.dataframe(_ident_rows,hide_index=True,width='stretch',height=max(250,min(900,38*(len(_ident_rows)+1))))"
          assert s.count(anchor)==1
          s=s.replace("             _ident_rows.append({'ID':_cid","             _ident_rows.append({'Erkennungsquelle':'Bestandsdaten / explizites Feld' if _article else ('Typ-/Modellfeld' if _model else 'Produktbezeichnung'),'ID':_cid",1)
          s=s.replace(anchor,anchor+"\n            st.download_button('Diagnose als CSV exportieren',data=__import__('csv').writer if False else _ident_csv(_ident_rows),file_name='TGA_Produkterkennung_Diagnose.csv',mime='text/csv')",1)
          helper="""def _ident_csv(rows):
              import csv,io
              f=io.StringIO()
              if rows:
                  writer=csv.DictWriter(f,fieldnames=list(rows[0].keys()),delimiter=';')
                  writer.writeheader()
                  writer.writerows(rows)
              return '\\ufeff'+f.getvalue()
          """
          # At module scope, before the app's Streamlit imports.
          import textwrap
          s=textwrap.dedent(helper)+'\n'+s
          ast.parse(s);p.write_text(s)
          v=Path('/tmp/tga/version.json');d=json.loads(v.read_text());d['version']='2.3.19';v.write_text(json.dumps(d))
          print('PASS syntax')
          PY
          python3 -m pip install -q streamlit pandas openpyxl requests beautifulsoup4 pypdf
          TGA_DATA_DIR=/tmp/tga_test python3 - <<'PY'
          import os,sqlite3
          from streamlit.testing.v1 import AppTest
          os.chdir('/tmp/tga')
          a=AppTest.from_file('app.py',default_timeout=45).run()
          assert not a.exception,a.exception
          c=sqlite3.connect('/tmp/tga_test/tga_finder.db')
          c.execute("INSERT INTO components(project,manufacturer,product,article_no,model_type,confidence,status,docs_searched) VALUES('Testprojekt','Helios','Ventilatorbox','09506','SB 125 A',90,'Prüfen',0)")
          c.commit()
          a.radio[0].set_value('📊 Dokumentenübersicht').run()
          assert not a.exception,a.exception
          assert any('Universelle Produkterkennung' in x.label for x in a.expander)
          print('PASS Streamlit audit UI')
          PY
          (cd /tmp/tga && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.3.19.zip" app.py version.json TGA_Updater.ps1)
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.3.19.zip
          git commit -m 'Release identity audit source and conservative verification 2.3.19'
          git pull --rebase origin main
          git push origin HEAD:main
