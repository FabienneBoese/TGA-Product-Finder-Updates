name: Publish TGA Product Finder v2.0.25 Model Recognition
on:
  push:
    paths:
      - '.github/workflows/publish-v208.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga225
          unzip -q TGA_Product_Finder_Update_v2.0.24.zip -d /tmp/tga225
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          p=Path('/tmp/tga225/app.py')
          s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "2.0.24"')==1
          s=s.replace('APP_VERSION = "2.0.24"','APP_VERSION = "2.0.25"',1)
          import ast
          start=s.index('def search_document_focused_web(')
          end=s.index('def multistage_document_candidates(',start)
          new=[
           'def search_document_focused_web(manufacturer,product,model):',
           ' """Provider-oriented document discovery with explicit rejection diagnostics."""',
           ' import requests,html',
           ' from bs4 import BeautifulSoup',
           ' from urllib.parse import urlparse,parse_qs,unquote',
           ' patterns=universal_product_search_patterns(manufacturer,product,model)',
           ' phrases=[p for p in patterns if p["Suchmuster"] in ("Datenblatt","Montageanleitung","Leistungserklärung","Zulassung","EPD")]',
           ' candidates=[];notes=[];seen=set()',
           ' providers=[("Google (experimentell)","https://www.google.com/search")]',
           ' for pattern in phrases:',
           '  term=pattern["Suchbegriff"];category=pattern["Suchmuster"]',
           '  for provider,endpoint in providers:',
           '   stats={"links":0,"pdf":0,"identity":0,"accepted":0}',
           '   try:',
           '    response=requests.get(endpoint,params={"q":term+" filetype:pdf","num":"8"},timeout=12,headers={"User-Agent":"Mozilla/5.0"})',
           '    if response.status_code in (403,429):',
           '     notes.append(category+": "+provider+" blockiert (HTTP "+str(response.status_code)+")");continue',
           '    response.raise_for_status()',
           '    if "text/html" not in response.headers.get("content-type","").lower():',
           '     notes.append(category+": "+provider+" liefert kein HTML");continue',
           '    soup=BeautifulSoup(response.text,"html.parser")',
           '    if soup.find(string=lambda v:bool(v and ("unusual traffic" in v.lower() or "captcha" in v.lower()))):',
           '     notes.append(category+": "+provider+" verlangt Bot-Prüfung");continue',
           '    for anchor in soup.select("a[href]"):',
           '     stats["links"]+=1',
           '     link=html.unescape(anchor.get("href",""))',
           '     if link.startswith("/url?"):link=parse_qs(urlparse(link).query).get("q",[""])[0]',
           '     parsed=urlparse(link)',
           '     if parsed.scheme!="https" or not parsed.hostname or not parsed.path.lower().endswith(".pdf"):continue',
           '     if parsed.hostname.lower().endswith("google.com"):continue',
           '     stats["pdf"]+=1',
           '     title=anchor.get_text(" ",strip=True) or parsed.path.rsplit("/",1)[-1]',
           '     context=(title+" "+unquote(parsed.path)).casefold()',
           '     name=str(manufacturer).casefold().strip(); identity=str(model).casefold().strip()',
           '     if not name or name not in context or not identity or identity not in context:continue',
           '     stats["identity"]+=1',
           '     if link in seen:continue',
           '     seen.add(link);stats["accepted"]+=1',
           '     kind={"Datenblatt":"Produktdatenblatt","Montageanleitung":"Montage & Betrieb – Hauptanleitung","Leistungserklärung":"Leistungserklärung (DoP)","Zulassung":"Zulassung/Prüfzeugnis","EPD":"EPD/DGNB/Umwelt"}[category]',
           '     candidates.append({"Kategorie":kind,"Titel":title,"Treffer %":60,"URL":link,"Quellseite":response.url,"Relevant":False,"Priorität":"Suchtreffer; Quelle und Ausführung prüfen"})',
           '     if stats["accepted"]>=5:break',
           '    notes.append(category+": "+provider+" – "+str(stats["links"])+" Links, "+str(stats["pdf"])+" PDF-Links, "+str(stats["identity"])+" passende, "+str(stats["accepted"])+" übernommen")',
           '   except requests.RequestException as exc:notes.append(category+": "+provider+" nicht erreichbar ("+str(exc)[:85]+")")',
           ' return candidates,notes',
           '',
          ]
          s=s[:start]+'\n'.join(new)+'\n'+s[end:]
          ast.parse(s)
          namespace={}
          exec('\n'.join(new),namespace)
          assert callable(namespace['search_document_focused_web'])
          assert 'Google (experimentell)' in s and 'PDF-Links' in s
          print('PASS: provider abstraction, HTTP block detection, extracted/rejected PDF diagnostics')
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          assert Path('/tmp/tga225/TGA_Updater.ps1').exists()
          print('PASS: Python syntax and updater present')
          PY
          (cd /tmp/tga225 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.0.25.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v2.0.25.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.0.25.zip
          git commit -m 'Build TGA Product Finder v2.0.25'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v2.0.25.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'2.0.25','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v2.0.25.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v2.0.25 update manifest'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
