name: Publish TGA Product Finder v2.0.22 Model Recognition
on:
  push:
    paths:
      - '.github/workflows/publish-v208.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga222
          unzip -q TGA_Product_Finder_Update_v2.0.21.zip -d /tmp/tga222
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          p=Path('/tmp/tga222/app.py')
          s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "2.0.21"')==1
          s=s.replace('APP_VERSION = "2.0.21"','APP_VERSION = "2.0.22"',1)
          import ast
          marker='def document_source_policy('
          assert s.count(marker)==1
          helper=[
           'def multistage_document_candidates(manufacturer,product,model,official_url=""):',
           ' """One action: official product discovery, verified page candidates, and KERMI fallback."""',
           ' stages=[]; hits=[]; source=""',
           ' def merge(items):',
           '  seen={str(x.get("URL","")).strip().lower() for x in hits}',
           '  for item in items:',
           '   key=str(item.get("URL","")).strip().lower()',
           '   if key and key not in seen: hits.append(item);seen.add(key)',
           ' try:',
           '  source,items=discover_official_product_docs(manufacturer,product,model)',
           '  merge(items);stages.append("Offizielle Produktseite automatisch geprüft")',
           ' except Exception as exc:',
           '  stages.append("Herstellerermittlung: "+str(exc)[:140])',
           ' if official_url and official_url.startswith("https://"):',
           '  try:',
           '   page,items=universal_docs_from_official_page(manufacturer,product,model,official_url)',
           '   if not source:source=page',
           '   merge(items);stages.append("Angegebene Herstellerseite geprüft")',
           '  except Exception as exc:',
           '   stages.append("Herstellerseite: "+str(exc)[:140])',
           ' if "kermi" in str(manufacturer).casefold() and "basic" in (str(product)+" "+str(model)).casefold():',
           '  try:',
           '   merge(kermi_basic_official_documents());stages.append("KERMI-Produkt- und geprüfte Drittquelle geprüft")',
           '  except Exception as exc:',
           '   stages.append("KERMI-Quellen: "+str(exc)[:140])',
           ' return source,hits,stages',
           '',
          ]
          s=s.replace(marker,'\n'.join(helper)+'\n'+marker,1)
          old="if st.button('Produktseite und Dokumente automatisch suchen',key=f'universal-auto-{cid}'):"
          assert s.count(old)==1
          start=s.rfind('\\n',0,s.index(old))+1
          end=s.rfind('\\n',0,s.index('with st.expander("Herstellerübergreifende Suchmuster',start))+1
          replacement=[
           "     if st.button('Mehrstufige Dokumentensuche starten',key=f'universal-auto-{cid}',type='primary'):",
           "      with st.spinner('Hersteller- und geprüfte Produktquellen werden durchsucht …'):",
           "       _source,_hits,_stages=multistage_document_candidates(m,p,a,_official)",
           "      st.session_state[f'universal-hits-{cid}']=_hits",
           "      st.session_state[f'universal-source-{cid}']=_source",
           "      st.session_state[f'universal-stages-{cid}']=_stages",
           "      if _hits:st.success(str(len(_hits))+' Dokumentkandidat(en) gefunden. Fachliche Freigabe offen.')",
           "      else:st.warning('Keine passenden PDF-Kandidaten gefunden. Suchprotokoll prüfen.')",
           "     if st.session_state.get(f'universal-stages-{cid}'):",
           "      with st.expander('Suchprotokoll',expanded=False):",
           "       for _step in st.session_state[f'universal-stages-{cid}']:st.write(_step)",
          ]
          indent=s[start:s.index('if st.button(',start)]
          replacement=[indent+line[5:] if line.startswith('     ') else line for line in replacement]
          s=s[:start]+'\n'.join(replacement)+'\n'+s[end:]
          ast.parse(s)
          assert s.count('Mehrstufige Dokumentensuche starten')==1
          assert 'merge(kermi_basic_official_documents())' in s
          print('PASS: multistage official/KERMI fallback, URL deduplication, single primary search button')
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          assert Path('/tmp/tga222/TGA_Updater.ps1').exists()
          print('PASS: Python syntax and updater present')
          PY
          (cd /tmp/tga222 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.0.22.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v2.0.22.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.0.22.zip
          git commit -m 'Build TGA Product Finder v2.0.22'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v2.0.22.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'2.0.22','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v2.0.22.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v2.0.22 update manifest'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
