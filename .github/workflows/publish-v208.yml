name: Publish TGA Product Finder v2.0.14 KERMI
on:
  push:
    paths:
      - '.github/workflows/publish-v208.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga214
          unzip -q TGA_Product_Finder_Update_v2.0.13.zip -d /tmp/tga214
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          p=Path('/tmp/tga214/app.py')
          s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "2.0.13"')==1
          s=s.replace('APP_VERSION = "2.0.13"','APP_VERSION = "2.0.14"',1)
          marker="def kermi_basic_official_documents():"
          assert s.count(marker)==1
          s=s.replace(marker,"def kermi_basic_official_documents():",1)
          old=" return hits[:30]"
          assert s.count(old)>=1
          idx=s.index(old,s.index(marker))
          addition=" # Herstellerdokument über eine produktspezifische Händlerseite als Sekundärquelle.\n # Die PDF-Signatur wird vor Anzeige geprüft; keine automatische Freigabe.\n vendor_url='https://www.duschmeister.de/images/products_upload/Montageanleitung_12334-2_doc1.pdf'\n try:\n  res=session.get(vendor_url,timeout=20,stream=True)\n  res.raise_for_status()\n  first=next(res.iter_content(chunk_size=4096),b'')\n  res.close()\n  if first.startswith(b'%PDF-') and vendor_url not in seen:\n   hits.append({'Kategorie':'Montage & Betrieb – Hauptanleitung','Titel':'KERMI Basic-E – Montageanleitung (Händlerquelle, Ausführung prüfen)','Treffer %':75,'URL':vendor_url,'Quellseite':'https://www.duschmeister.de/Kermi-Badheizkoerper-Basic-E.html','Relevant':False,'Priorität':'Prüfen: Herstellerdokument über Händlerquelle; Modell und Revision vor Freigabe bestätigen'})\n except requests.RequestException:\n  pass\n"

          s=s[:idx]+addition+s[idx:]
          s=s.replace("st.warning('Keine verifizierten PDF-Dateien auf der offiziellen KERMI-Familienseite gefunden.')","st.warning('Weder auf der KERMI-Seite noch über die geprüfte produktspezifische Sekundärquelle eine echte PDF gefunden.')",1)
          assert "Montageanleitung_12334-2_doc1.pdf" in s
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          assert Path('/tmp/tga214/TGA_Updater.ps1').exists()
          print('PASS: Python syntax and updater present')
          PY
          (cd /tmp/tga214 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.0.14.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v2.0.14.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.0.14.zip
          git commit -m 'Build TGA Product Finder v2.0.14'
          git pull --rebase origin main
          git push
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v2.0.14.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'2.0.14','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v2.0.14.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v2.0.14 update manifest'
          git pull --rebase origin main
          git push
