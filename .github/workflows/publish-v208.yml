name: Publish TGA Product Finder v2.0.13 KERMI
on:
  push:
    paths:
      - '.github/workflows/publish-v208.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga213
          unzip -q TGA_Product_Finder_Update_v2.0.12.zip -d /tmp/tga213
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          p=Path('/tmp/tga213/app.py')
          s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "2.0.12"')==1
          s=s.replace('APP_VERSION = "2.0.12"','APP_VERSION = "2.0.13"',1)
          marker="st.info('Für KERMI Basic-E die offizielle Herstellerseite https://www.kermi.com/de/de/produkte/bad-und-wohnheizkoerper/basic-50/ prüfen. Für PDF-Kandidaten die universelle Suche verwenden.'); # "
          assert s.count(marker)==1
          replacement="""if 'kermi' in str(m).lower() and 'basic' in str(p+' '+a).lower():
    if st.button('KERMI-Dokumente direkt beim Hersteller prüfen',key=f'kermi_direct_{cid}'):
     try:
      _khits=kermi_basic_official_documents()
      st.session_state[f'universal-hits-{cid}']=_khits
      st.session_state[f'universal-source-{cid}']='KERMI Basic Herstellerseite'
      if _khits:st.success(str(len(_khits))+' verifizierte KERMI-PDF-Kandidaten gefunden. Fachliche Freigabe offen.')
      else:st.warning('Keine verifizierten PDF-Dateien auf der offiziellen KERMI-Familienseite gefunden.')
     except Exception as exc:
      st.warning('KERMI-Suche derzeit nicht erfolgreich: '+str(exc)[:160])
    st.caption('Die genaue Basic-E-Ausführung vor fachlicher Freigabe prüfen.')
   # """
          s=s.replace(marker,replacement,1)
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          assert Path('/tmp/tga213/TGA_Updater.ps1').exists()
          print('PASS: Python syntax and updater present')
          PY
          (cd /tmp/tga213 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.0.13.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v2.0.13.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.0.13.zip
          git commit -m 'Build TGA Product Finder v2.0.13'
          git pull --rebase origin main
          git push
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v2.0.13.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'2.0.13','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v2.0.13.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v2.0.13 update manifest'
          git pull --rebase origin main
          git push
