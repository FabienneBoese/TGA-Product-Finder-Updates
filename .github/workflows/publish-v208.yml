name: Publish TGA Product Finder v2.0.20 Offline Save
on:
  push:
    paths:
      - '.github/workflows/publish-v208.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga220
          unzip -q TGA_Product_Finder_Update_v2.0.19.zip -d /tmp/tga220
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          p=Path('/tmp/tga220/app.py')
          s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "2.0.19"')==1
          s=s.replace('APP_VERSION = "2.0.19"','APP_VERSION = "2.0.20"',1)
          assert 'def document_source_policy(' in s
          marker='def document_source_policy('
          assert s.count(marker)==1
          strategy=[
           'def universal_product_search_patterns(manufacturer,product,article=""):',
           ' """Generate reusable search terms for every product."""',
           ' m=str(manufacturer or "").strip(); p=str(product or "").strip(); a=str(article or "").strip()',
           ' raw=[("Hersteller + Produkt + Artikelnummer"," ".join(x for x in (m,p,a) if x)),("Hersteller + Artikelnummer"," ".join(x for x in (m,a) if x)),("Hersteller + Typ"," ".join(x for x in (m,p) if x))]',
           ' for kind,term in (("Datenblatt","Datenblatt PDF"),("Montageanleitung","Montageanleitung PDF"),("Leistungserklärung","DoP PDF"),("Zulassung","Zulassung PDF"),("EPD","EPD PDF")):',
           '  raw.append((kind," ".join(x for x in (m,p,a,term) if x)))',
           ' seen=set(); result=[]',
           ' for label,query in raw:',
           '  key=query.casefold()',
           '  if key and key not in seen:',
           '   seen.add(key);result.append({"Suchmuster":label,"Suchbegriff":query})',
           ' return result',
           '',
          ]
          s=s.replace(marker,'\n'.join(strategy)+'\n'+marker,1)
          needle="if st.button('Dokumentkandidaten auf Herstellerseite suchen',key=f'universal-search-{cid}'):"
          lines=s.splitlines()
          matches=[i for i,line in enumerate(lines) if needle in line]
          assert len(matches)==1
          idx=matches[0]
          indent=lines[idx][:len(lines[idx])-len(lines[idx].lstrip())]
          addition=[
           indent+'with st.expander("Herstellerübergreifende Suchmuster für dieses Produkt",expanded=False):',
           indent+' st.caption("Suchbegriffe für Typ, Artikelnummer und Dokumentarten. Treffer sind nicht automatisch freigegeben.")',
           indent+' st.dataframe(pd.DataFrame(universal_product_search_patterns(m,p,a)),hide_index=True,width="stretch")',
          ]
          lines[idx:idx]=addition
          s='\n'.join(lines)+'\n'
          assert 'universal_product_search_patterns(m,p,a)' in s
          print('PASS: reusable universal search patterns visible in generic product search')
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          assert Path('/tmp/tga220/TGA_Updater.ps1').exists()
          print('PASS: Python syntax and updater present')
          PY
          (cd /tmp/tga220 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.0.20.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v2.0.20.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.0.20.zip
          git commit -m 'Build TGA Product Finder v2.0.20'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v2.0.20.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'2.0.20','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v2.0.20.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v2.0.20 update manifest'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
