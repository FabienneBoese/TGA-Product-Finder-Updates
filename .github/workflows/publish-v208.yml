name: Publish TGA Product Finder v2.2.0 Model Recognition
on:
  push:
    paths:
      - '.github/workflows/publish-v208.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga220
          unzip -q TGA_Product_Finder_Update_v2.1.9.zip -d /tmp/tga220
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          p=Path('/tmp/tga220/app.py')
          s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "2.1.9"')==1
          s=s.replace('APP_VERSION = "2.1.9"','APP_VERSION = "2.2.0"',1)
          import ast
          start=s.index('def search_document_focused_web(')
          end=s.index('def multistage_document_candidates(',start)
          new=[
           "def search_document_focused_web(manufacturer,product,model,official_url=\"\"):",
           " \"\"\"Discover manufacturer product pages via robots, XML/GZ sitemaps and limited navigation.\"\"\"",
           " import requests,re,gzip,xml.etree.ElementTree as ET",
           " from bs4 import BeautifulSoup",
           " from urllib.parse import urlparse,urljoin,unquote",
           " from collections import deque",
           " manufacturer=str(manufacturer).strip();product=str(product).strip();model=str(model).strip()",
           " basic_e=\"kermi\" in manufacturer.casefold() and bool(re.search(r\"(?<![a-z0-9])basic[ –—‐−-]*e(?![a-z0-9])\",(product+\" \"+model).casefold()))",
           " notes=[]",
           " if basic_e:notes.append(\"Produktabgleich: Basic-E und Basic 50 bleiben getrennt\")",
           " parsed=urlparse(str(official_url or \"\"))",
           " if \"kermi\" in manufacturer.casefold():domain=\"www.kermi.com\"",
           " elif parsed.scheme==\"https\" and parsed.hostname and re.fullmatch(r\"[a-z0-9.-]+\",parsed.hostname) and not parsed.hostname.endswith((\".local\",\".internal\")):domain=parsed.hostname",
           " else:return [],notes+[\"Produktidentifikation: Keine verifizierbare Herstellerdomain vorhanden\"]",
           " base=\"https://\"+domain",
           " session=requests.Session();session.headers.update({\"User-Agent\":\"Mozilla/5.0 (compatible; TGAProductFinder/2.0)\"})",
           " attempts=[];errors=[];xml_count=0;discovered=0",
           " def fetch(url):",
           "  p=urlparse(url)",
           "  if p.scheme!=\"https\" or p.hostname!=domain:return None",
           "  try:",
           "   r=session.get(url,timeout=9,allow_redirects=False,stream=True)",
           "   attempts.append(str(r.status_code)+\" \"+p.path[:90])",
           "   if r.status_code!=200:return None",
           "   size=0;chunks=[]",
           "   for chunk in r.iter_content(65536):",
           "    size+=len(chunk)",
           "    if size>2500000:errors.append(\"Antwort zu groß: \"+p.path[:70]);return None",
           "    chunks.append(chunk)",
           "   r._content=b\"\".join(chunks)",
           "   return r",
           "  except requests.RequestException as exc:",
           "   errors.append(type(exc).__name__+\" \"+p.path[:70]);return None",
           "  finally:",
           "   try:r.close()",
           "   except UnboundLocalError:pass",
           " # Document-based evidence: bounded verified PDF, never auto-approve a variant.",
           " document_sources=[]",
           " if basic_e:",
           "  document_sources=[\"https://www.heizungsdiscount24.de/pdf/Kermi-Badheizkoerper-Basic-E-AK3-Montageanleitung.pdf\"]",
           " if parsed.scheme==\"https\" and parsed.path.lower().endswith(\".pdf\") and parsed.hostname==domain:document_sources.insert(0,str(official_url))",
           " doc_checked=0;doc_evidence=[];doc_errors=[]",
           " for pdf_url in document_sources[:2]:",
           "  try:",
           "   rr=requests.get(pdf_url,timeout=12,stream=True,headers={\"User-Agent\":\"Mozilla/5.0\"})",
           "   if rr.status_code!=200:doc_errors.append(\"HTTP \"+str(rr.status_code));rr.close();continue",
           "   buf=bytearray()",
           "   for chunk in rr.iter_content(65536):",
           "    buf.extend(chunk)",
           "    if len(buf)>4500000:break",
           "   rr.close()",
           "   if len(buf)>4500000 or not bytes(buf[:5])==b\"%PDF-\":doc_errors.append(\"Keine kleine gültige PDF\");continue",
           "   doc_checked+=1;pdf_text=\"\"",
           "   try:",
           "    from pypdf import PdfReader",
           "    from io import BytesIO",
           "   except ImportError:",
           "    try:",
           "     import subprocess,sys,importlib",
           "     install=subprocess.run([sys.executable,\"-m\",\"pip\",\"install\",\"--disable-pip-version-check\",\"--quiet\",\"pypdf>=5,<7\"],capture_output=True,text=True,timeout=60,check=False)",
           "     if install.returncode!=0:raise RuntimeError(\"Installation fehlgeschlagen: \"+install.stderr[-160:])",
           "     importlib.invalidate_caches()",
           "     from pypdf import PdfReader",
           "     from io import BytesIO",
           "     notes.append(\"PDF-Bibliothek: pypdf automatisch eingerichtet\")",
           "    except (ImportError,RuntimeError,subprocess.TimeoutExpired) as exc:",
           "     doc_errors.append(\"PDF-Bibliothek nicht verfügbar: \"+str(exc)[:180])",
           "     PdfReader=None",
           "   if PdfReader is not None:",
           "    try:",
           "     pdf=PdfReader(BytesIO(buf));page_texts=[(page.extract_text() or \"\") for page in pdf.pages[:80]];pdf_text=\" \".join(page_texts)",
           "     total_pages=len(pdf.pages);empty_pages=sum(not t.strip() for t in page_texts)",
           "     notes.append(\"PDF-Textausbeute: \"+str(total_pages)+\" Seiten insgesamt, \"+str(len(page_texts))+\" analysiert, \"+str(len(pdf_text))+\" Zeichen, \"+str(empty_pages)+\" leere Textseiten\")",
           "     if total_pages>80:notes.append(\"PDF-Analyse begrenzt: erste 80 Seiten\")",
           "     if not pdf_text.strip():doc_errors.append(\"PDF enthält keinen extrahierbaren Text (ggf. Scan)\")",
           "    except Exception as exc:doc_errors.append(\"PDF-Textfehler: \"+type(exc).__name__)",
           "   if pdf_text:",
           "    matches=sorted(set(re.findall(r\"basic[\\s\\u00ad\\-\\u2010-\\u2015]*e(?![a-z0-9])(?:[\\s\\-]*[a-z0-9]{1,10})?\",pdf_text,re.I)))[:8]",
           "    # Manufacturer-neutral candidate discovery from text; evidence only, not an assignment.",
           "    import unicodedata",
           "    def normalize(value):",
           "     value=unicodedata.normalize(\"NFKC\",str(value)).casefold()",
           "     return re.sub(r\"[^a-z0-9]+\",\"\",value)",
           "    expected=[x for x in (product,model) if len(normalize(x))>=4]",
           "    manufacturer_key=normalize(manufacturer)",
           "    manufacturer_pages=[i+1 for i,t in enumerate(page_texts) if manufacturer_key and manufacturer_key in normalize(t)]",
           "    notes.append(\"PDF-Herstellerabgleich: \"+str(len(manufacturer_pages))+\" Textseiten mit Herstellerhinweis\")",
           "    if expected:",
           "     for term in expected[:2]:",
           "      pages=[i+1 for i,t in enumerate(page_texts) if normalize(term) in normalize(t)]",
           "      notes.append(\"PDF-Abgleich \"+repr(term[:35])+\": \"+str(len(pages))+\" Seiten mit exakter normalisierter Zeichenfolge\"+(\", Seiten \"+\", \".join(map(str,pages[:5])) if pages else \"\"))",
           "    candidate_hits=[];candidate_seen=set()",
           "    for page_no,page_text in enumerate(page_texts,1):",
           "     for raw_line in page_text.splitlines()[:500]:",
           "      line=\" \".join(raw_line.split())[:160]",
           "      if not 4<=len(line)<=120:continue",
           "      if not re.search(r\"(?i)(?:basic|typ\\s*[:/]|modell\\s*[:/]|model\\s*[:/]|art(?:ikel)?\\.?\\s*[- ]?nr\\.?|\\b[A-Z]{2,5}[- /]?\\d{2,6}\\b)\",line):continue",
           "      if re.search(r\"(?i)https?://|www\\.|copyright|telefon|fax|seite\\s+\\d\",line):continue",
           "      key=normalize(line)",
           "      if key in candidate_seen:continue",
           "      candidate_seen.add(key);candidate_hits.append((page_no,line))",
           "      if len(candidate_hits)>=12:break",
           "     if len(candidate_hits)>=12:break",
           "    notes.append(\"PDF-Produktkandidaten: \"+str(len(candidate_hits))+\" unterschiedliche Textzeilen (ungeprüft)\")",
           "    for page_no,line in candidate_hits[:8]:notes.append(\"PDF-Kandidat Seite \"+str(page_no)+\": \"+line[:110])",
           "    # Evidence scoring is deliberately conservative and does not grant approval.",
           "    def document_evidence_score(text_pages,make,designation,variant):",
           "     import unicodedata",
           "     def tokens(s):",
           "      s=unicodedata.normalize(\"NFKC\",str(s)).casefold()",
           "      return [v for v in re.split(r\"[^a-z0-9]+\",s) if len(v)>=2]",
           "     flat=\" \".join(text_pages)",
           "     flat_tokens=tokens(flat)",
           "     doc_set=set(flat_tokens)",
           "     make_tokens=tokens(make);name_tokens=tokens(designation);variant_tokens=tokens(variant)",
           "     make_hits=[v for v in make_tokens if v in doc_set]",
           "     name_hits=[v for v in name_tokens if v in doc_set]",
           "     variant_hits=[v for v in variant_tokens if v in doc_set]",
           "     normalized=re.sub(r\"[^a-z0-9]+\",\"\",flat.casefold())",
           "     exact_name=bool(name_tokens) and \"\".join(name_tokens) in normalized",
           "     exact_variant=bool(variant_tokens) and \"\".join(variant_tokens) in normalized",
           "     conflict=bool(basic_e and re.search(r\"(?i)basic\\s*[- ]?50\",flat) and not re.search(r\"(?i)basic\\s*[- ]?e\\b\",flat))",
           "     score=min(95,25*bool(make_hits)+20*bool(name_hits)+20*bool(variant_hits)+15*exact_name+15*exact_variant)",
           "     if conflict:score=min(score,20)",
           "     return score,make_hits,name_hits,variant_hits,conflict",
           "    score,make_hits,name_hits,variant_hits,conflict=document_evidence_score(page_texts,manufacturer,product,model)",
           "    notes.append(\"PDF-Produktabgleich: \"+str(score)+\" % Indizienwert (keine Freigabe); Hersteller \"+str(len(make_hits))+\", Produkt \"+str(len(name_hits))+\", Modell \"+str(len(variant_hits))+\" passende Tokens\")",
           "    if conflict:notes.append(\"PDF-Konflikt: Basic 50 ohne Basic-E-Nachweis; keine Zuordnung\")",
           "    if score<60:notes.append(\"PDF-Zuordnung: ungeprüft; Produktidentität nicht ausreichend belegt\")",
           "    else:notes.append(\"PDF-Zuordnung: Kandidat zur manuellen Prüfung; keine automatische Freigabe\")",
           "    # Extract exact technical type identifiers; do not assume a family relationship.",
           "    type_pattern=re.compile(r\"\\b(?:[A-Z][A-Z0-9]{1,5}\\d{1,5}|E0E\\d{2,5})\\s*[-/]?\\s*AK\\s*\\d{1,3}\\b\",re.I)",
           "    types_found={}",
           "    for page_no,content in enumerate(page_texts,1):",
           "     for match in type_pattern.finditer(content):",
           "      typ=\" \".join(match.group(0).upper().split())",
           "      if typ not in types_found:types_found[typ]=[]",
           "      if page_no not in types_found[typ]:types_found[typ].append(page_no)",
           "    notes.append(\"PDF-Typenextraktion: \"+str(len(types_found))+\" unterschiedliche technische Typen (ungeprüft)\")",
           "    for typ,pages in list(types_found.items())[:12]:notes.append(\"PDF-Technischer Typ: \"+typ+\" | Seite \"+\", \".join(map(str,pages[:8])))",
           "    model_normalized=re.sub(r\"[^A-Z0-9]\",\"\",model.upper())",
           "    direct=[typ for typ in types_found if re.sub(r\"[^A-Z0-9]\",\"\",typ)==model_normalized]",
           "    if direct:notes.append(\"PDF-Typenabgleich: Exakter technischer Typ stimmt überein; Hersteller und Ausführung weiter prüfen\")",
           "    elif types_found:notes.append(\"PDF-Typenabgleich: Technische Typen gefunden, aber keine belegte Zuordnung zur Produktfamilie \"+model[:50])",
           "    if basic_e and types_found:notes.append(\"KERMI-Prüfstatus: ERE10/E0E10 dürfen ohne offiziellen Typen-Familiennachweis nicht Basic-E zugeordnet werden\")",
           "    if matches:doc_evidence.extend(matches)",
           "    if not matches and len(pdf_text)>0:notes.append(\"PDF-Produktsuche: Text vorhanden, aber keine eindeutige Basic-E-Bezeichnung\")",
           "    if matches:",
           "     for hit in matches[:5]:",
           "      page_numbers=[str(i+1) for i,t in enumerate(page_texts) if re.search(re.escape(hit),t,re.I)]",
           "      if page_numbers:notes.append(\"PDF-Fundstelle: \"+hit[:45]+\" auf Seite \"+\", \".join(page_numbers[:5]))",
           "  except requests.RequestException as exc:doc_errors.append(type(exc).__name__)",
           " notes.append(\"Dokumentenanalyse: \"+str(doc_checked)+\" PDF geprüft, \"+str(len(doc_evidence))+\" Basic-E-Textmerkmale; keine automatische Variantenfreigabe\")",
           " if doc_evidence:notes.append(\"PDF-Produktmerkmale (ungeprüft): \"+\", \".join(doc_evidence))",
           " if doc_errors:notes.append(\"PDF-Diagnose: \"+\"; \".join(doc_errors[:3]))",
           " candidates=[];seen_urls=set()",
           " def add(url):",
           "  p=urlparse(url)",
           "  if p.scheme==\"https\" and p.hostname==domain and url not in seen_urls:",
           "   seen_urls.add(url);candidates.append(url)",
           " sitemap_queue=deque([base+\"/de/de/sitemap.xml\",base+\"/sitemap.xml\",base+\"/sitemap_index.xml\"])",
           " robots=fetch(base+\"/robots.txt\")",
           " if robots is not None:",
           "  for line in robots.text.splitlines():",
           "   if line.lower().lstrip().startswith(\"sitemap:\"):",
           "    u=line.split(\":\",1)[1].strip()",
           "    if urlparse(u).scheme==\"https\" and urlparse(u).hostname==domain:sitemap_queue.append(u)",
           " visited_xml=set()",
           " while sitemap_queue and xml_count<12:",
           "  url=sitemap_queue.popleft()",
           "  if url in visited_xml:continue",
           "  visited_xml.add(url);r=fetch(url)",
           "  if r is None:continue",
           "  payload=r.content",
           "  if urlparse(url).path.endswith(\".gz\") or payload[:2]==b\"\\x1f\\x8b\":",
           "   try:payload=gzip.decompress(payload)",
           "   except (OSError,EOFError):errors.append(\"GZIP ungültig: \"+urlparse(url).path[:70]);continue",
           "  if len(payload)>12000000:errors.append(\"XML zu groß: \"+urlparse(url).path[:70]);continue",
           "  try:tree=ET.fromstring(payload)",
           "  except ET.ParseError:errors.append(\"XML ungültig: \"+urlparse(url).path[:70]);continue",
           "  xml_count+=1",
           "  for node in tree.iter():",
           "   if node.tag.rsplit(\"}\",1)[-1]!=\"loc\" or not node.text:continue",
           "   link=node.text.strip();p=urlparse(link)",
           "   if p.scheme!=\"https\" or p.hostname!=domain:continue",
           "   if p.path.lower().endswith((\".xml\",\".xml.gz\")):",
           "    if len(sitemap_queue)<80 and (\"/de/de/\" in p.path or \"/de/\" in p.path):sitemap_queue.appendleft(link)",
           "   elif \"/de/de/\" in p.path or \"/de/\" in p.path:add(link);discovered+=1",
           " nav=0",
           " if not candidates:",
           "  for root in ([str(official_url)] if parsed.scheme==\"https\" and parsed.hostname==domain else [])+[base+\"/de/de/\"]:",
           "   r=fetch(root)",
           "   if r is None or \"html\" not in r.headers.get(\"content-type\",\"\").lower():continue",
           "   nav+=1;soup=BeautifulSoup(r.text,\"html.parser\")",
           "   for a in soup.select(\"a[href]\")[:1500]:",
           "    target=urljoin(root,a.get(\"href\",\"\"));p=urlparse(target)",
           "    if p.hostname==domain and p.scheme==\"https\":add(target)",
           " pattern=re.compile(r\"basic[-_/ ]?e(?![a-z0-9])\",re.I)",
           " terms=[t for t in re.split(r\"[^a-z0-9]+\",model.casefold()) if len(t)>2]",
           " ranked=[u for u in candidates if (pattern.search(unquote(urlparse(u).path)) if basic_e else bool(terms and all(t in unquote(urlparse(u).path).casefold() for t in terms)))]",
           " notes.append(\"Sitemap-Diagnose: \"+str(xml_count)+\" XML-Sitemaps, \"+str(discovered)+\" deutsche Sitemap-URLs, \"+str(nav)+\" Navigations-Startseiten, \"+str(len(ranked))+\" Modell-URL-Kandidaten\")",
           " notes.append(\"Sitemap-Abrufe: \"+\"; \".join(attempts[:12]))",
           " if errors:notes.append(\"Sitemap-Fehler: \"+\"; \".join(errors[:5]))",
           " content_checked=0;content_matches=[]",
           " if basic_e:",
           "  keywords=(\"heizkoerper\",\"heizkörper\",\"badheiz\",\"badheizkoerper\",\"radiator\",\"bad-und-design\",\"basic\",\"elektro\",\"electric\",\"handtuch\")",
           "  pool=[u for u in candidates if any(k in unquote(urlparse(u).path).casefold() for k in keywords)]",
           "  pool=sorted(pool,key=lambda u:(0 if \"basic\" in u.casefold() else 1,0 if \"bad\" in u.casefold() or \"heiz\" in u.casefold() else 1,len(u)))",
           "  for url in pool[:32]:",
           "   if url in ranked:continue",
           "   r=fetch(url)",
           "   if r is None or \"html\" not in r.headers.get(\"content-type\",\"\").lower():continue",
           "   content_checked+=1;soup=BeautifulSoup(r.text,\"html.parser\")",
           "   title=soup.title.get_text(\" \",strip=True) if soup.title else \"\"",
           "   headings=\" \".join(h.get_text(\" \",strip=True) for h in soup.select(\"h1,h2,h3\")[:12])",
           "   if re.search(r\"basic\\s*[- ]?e(?![a-z0-9])\",title+\" \"+headings,re.I):content_matches.append((url,soup))",
           "  notes.append(\"Inhaltssuche: \"+str(len(pool))+\" relevante URL-Kandidaten, \"+str(content_checked)+\" Seiten geprüft, \"+str(len(content_matches))+\" Basic-E-Titel-/Überschriftentreffer\")",
           " validated=[]",
           " validated.extend(content_matches)",
           " for url in ranked[:8]:",
           "  r=fetch(url)",
           "  if r is None or \"html\" not in r.headers.get(\"content-type\",\"\").lower():continue",
           "  soup=BeautifulSoup(r.text,\"html.parser\")",
           "  title=soup.title.get_text(\" \",strip=True) if soup.title else \"\"",
           "  heading=\" \".join(h.get_text(\" \",strip=True) for h in soup.select(\"h1,h2\")[:5])",
           "  evidence=title+\" \"+heading",
           "  if basic_e and not re.search(r\"basic\\s*[- ]?e(?![a-z0-9])\",evidence,re.I):continue",
           "  if not basic_e and not all(t in evidence.casefold() for t in terms):continue",
           "  if url not in [x[0] for x in validated]:validated.append((url,soup))",
           " found=[];seen=set()",
           " for page,soup in validated:",
           "  for a in soup.select(\"a[href]\"):",
           "   target=urljoin(page,a.get(\"href\",\"\"));p=urlparse(target)",
           "   if p.scheme!=\"https\" or p.hostname!=domain or not p.path.lower().endswith(\".pdf\"):continue",
           "   label=a.get_text(\" \",strip=True);context=(label+\" \"+unquote(p.path)).casefold()",
           "   if basic_e and not pattern.search(context):continue",
           "   if target in seen:continue",
           "   seen.add(target)",
           "   found.append({\"Kategorie\":\"Sonstiges\",\"Titel\":label or p.path.rsplit(\"/\",1)[-1],\"Treffer %\":50,\"URL\":target,\"Quellseite\":page,\"Relevant\":False,\"Priorität\":\"Hersteller-PDF-Kandidat; Variante prüfen\"})",
           " notes.append(\"Produktidentifikation: \"+str(len(validated))+\" passende Produktseiten, \"+str(len(found))+\" ungeprüfte PDF-Kandidaten\")",
           " if not validated:notes.append(\"Keine bestätigte Hersteller-Produktseite; vorhandene Drittquellen bleiben unverändert\")",
           " return found,notes",
          ]
          s=s[:start]+'\n'.join(new)+'\n'+s[end:]
          # Keine riskante automatische Umdeutung alter Artikelnummern:
          # Typ/Modell ist eine eigene persistente Information.
          schema_lines=[line for line in s.splitlines() if "if 'manufacturer_product_name' not in ccols:" in line]
          assert len(schema_lines)==1,('schema anchor',len(schema_lines))
          s=s.replace(schema_lines[0],schema_lines[0]+"\n  if 'model_type' not in ccols: c.execute('ALTER TABLE components ADD COLUMN model_type TEXT DEFAULT \"\"')",1)
          # Explizit bestaetigte Herstellerbezeichnung vorziehen, sonst Original beibehalten.
          row_lines=[line for line in s.splitlines() if "overview.append({" in line and "'Offline-PDFs':ooffline" in line]
          assert len(row_lines)==1,('overview row count',len(row_lines))
          old=row_lines[0]
          new="    _verified_name,_name_ok,_model=con.execute('SELECT manufacturer_product_name,product_name_confirmed,model_type FROM components WHERE id=?',(ocid,)).fetchone()\n    _display_name=_verified_name if _name_ok and str(_verified_name or '').strip() else op\n    overview.append({'Status':docstatus.split()[0],'Hersteller':om,'Bezeichnung':_display_name,'Typ / Modell':_model or '—','Artikelnummer':oa or '—','Erkennung %':oconf,'Produkterkennung':ostat,'Empfohlen':orecommended,'Offline-PDFs':ooffline,'Online-Nachweise':oonline,'Prüfen':ocheck})"
          s=s.replace(old,new,1)
          # Typenfeld im Produktbereich bearbeitbar; Originalbezeichnung und Artikelnummer unveraendert.
          targets=[line for line in s.splitlines() if "with st.expander(f'{m} · {p}'" in line and "conf" in line]
          assert len(targets)==1,('component expander',len(targets))
          target=targets[0]
          pad=target[:len(target)-len(target.lstrip())]
          insert=pad+" _current_model=con.execute('SELECT model_type FROM components WHERE id=?',(cid,)).fetchone()[0] or ''\n"+pad+" _new_model=st.text_input('Typ / Modell (getrennt von Artikelnummer)',value=_current_model,key=f'model_type_{cid}')\n"+pad+" if _new_model.strip()!=_current_model.strip():\n"+pad+"  if st.button('Typ / Modell speichern',key=f'save_model_{cid}'):\n"+pad+"   con.execute('UPDATE components SET model_type=? WHERE id=?',(_new_model.strip(),cid));con.commit();st.rerun()"
          s=s.replace(target,target+"\n"+insert,1)
          print('PASS: separate persistente Modellspalte, bestaetigte Bezeichnung und manuelle Typkorrektur')
          ast.parse(s)
          print('PASS: structured technical type extraction and unverified family separation')
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          assert Path('/tmp/tga220/TGA_Updater.ps1').exists()
          print('PASS: Python syntax and updater present')
          # Pflichtpruefungen: Freigabe nur bei erfolgreichen Regressionstests.
          import re, zipfile
