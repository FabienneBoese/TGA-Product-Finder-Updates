name: Publish TGA Product Finder v2.2.4 Model Recognition
on:
  push:
    paths:
      - '.github/workflows/publish-v208.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga224
          unzip -q TGA_Product_Finder_Update_v2.2.3.zip -d /tmp/tga224
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          p=Path('/tmp/tga224/app.py')
          s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "2.2.3"')==1
          s=s.replace('APP_VERSION = "2.2.3"','APP_VERSION = "2.2.4"',1)
          import ast
          a=s.index('def classify_component_identifier(')
          b=s.index('def db():',a)
          block=s[a:b]
          anchor=" if 'rockwool' in maker and re.fullmatch"
          assert anchor in block
          extra=""" if 'reflex' in maker and (re.fullmatch(r'N\\s*\\d{2,4}',normalized) or re.fullmatch(r'SERVITEC\\s+[A-Z0-9-]+',normalized)):
            return (normalized,'','type')
           if 'reflex' in maker and normalized.startswith('FILLSET COMPACT'):
            return ('', '', 'family')
           if 'wika' in maker and re.fullmatch(r'\\d{3}\\.\\d{2}\\s+NG\\s*\\d{2,3}',normalized):
            return (normalized,'','type')
           if 'viega' in maker and normalized=='PROFIPRESS':
            return ('','','family')
          """
          block=block.replace(anchor,extra+anchor,1)
          s=s[:a]+block+s[b:]
          # Familienkennungen sind keine Artikelnummern: in der Produktbezeichnung
          # bleibt der Excel-Originalwert als Nachweis erhalten.
          a=s.index('for _cid,_maker,_product,_article,_model in c.execute(')
          b=s.index('c.commit(); return c',a)
          migration=s[a:b]
          anchor="if _kind in ('type','type_candidate') and not str(_model or '').strip():"
          assert anchor in migration
          migration=migration.replace(anchor,"if _kind=='family' and str(_article or '').strip():\n   c.execute('UPDATE components SET article_no=? WHERE id=?',('',_cid))\n  "+anchor,1)
          s=s[:a]+migration+s[b:]
          # Keine Familienkennungen als Artikelnummern importieren.
          a=s.index('_final_article=_candidate_article if not _input_type else clean(r.Artikelnummer)')
          s=s[:a]+s[a:].replace('_final_article=_candidate_article if not _input_type else clean(r.Artikelnummer)',"_final_article=(_candidate_article if _kind!='family' else '') if not _input_type else ('' if _kind=='family' else clean(r.Artikelnummer))",1)
          # Erkennungsstatus in der Tabelle muss zwischen Vollstaendigkeit und
          # nachgewiesener konkreter Identitaet unterscheiden.
          anchor="overview.append({'Status':docstatus.split()[0]"
          a=s.index(anchor);b=s.index(chr(10),a)
          line=s[a:b]
          line=line.replace("'Erkennung %':min(oconf,85) if oa and classify_component_identifier(om,op,oa)[2]=='unclassified' else oconf","'Erkennung %':min(oconf,85) if oa and classify_component_identifier(om,op,oa)[2]=='unclassified' else oconf,'Datenvollständigkeit %':min(45+(20 if om else 0)+(20 if op else 0)+(15 if oa or _model else 0),100),'Produktidentifikation':'Herstellerprüfung offen' if not _name_ok else 'Herstellerbezeichnung bestätigt'")
          s=s[:a]+line+s[b:]
          tree=ast.parse(s)
          scope={}
          exec(compile(ast.Module(body=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='classify_component_identifier'],type_ignores=[]),'<test>','exec'),scope)
          fn=scope['classify_component_identifier']
          for maker,model in [('Reflex','N 300'),('Reflex','Servitec S'),('WIKA','111.10 NG 63')]:
           assert fn(maker,'',model)[2]=='type',(maker,model)
          assert fn('Reflex','','Fillset Compact Twin')[2]=='family'
          assert fn('Viega','','Profipress')[2]=='family'
          assert fn('GEBERIT','','501.632.00.1')[2]=='article'
          print('PASS: Reflex, WIKA, Viega und Geberit getrennt')
          ast.parse(s)
          print('PASS: structured technical type extraction and unverified family separation')
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          assert Path('/tmp/tga224/TGA_Updater.ps1').exists()
          print('PASS: Python syntax and updater present')
          # Pflichtpruefungen: Freigabe nur bei erfolgreichen Regressionstests.
          import re, zipfile
          function=ast.parse(s).body
          matching=[n for n in function if isinstance(n,ast.FunctionDef) and n.name=='search_document_focused_web']
          assert len(matching)==1, 'Suchfunktion fehlt oder mehrfach vorhanden'
          source=ast.get_source_segment(s,matching[0])
          assert source and 'PDF-Typenextraktion:' in source, 'Typenextraktion fehlt'
          assert 'keine automatische Variantenfreigabe' in source, 'Freigabesperre fehlt'
          assert 'Basic-E und Basic 50 bleiben getrennt' in source, 'Variantentrennung fehlt'
          assert 'keine belegte Zuordnung zur Produktfamilie' in source, 'Familienzuordnung nicht abgesichert'
          patterns=[n for n in ast.walk(matching[0]) if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='type_pattern' for t in n.targets)]
          assert len(patterns)==1, 'Typenmuster fehlt'
          type_regex=ast.literal_eval(patterns[0].value.args[0])
          regex=re.compile(type_regex,re.I)
          assert regex.search('ERE10 AK3'), 'KERMI ERE10 nicht erkannt'
          assert regex.search('E0E10 AK3'), 'KERMI E0E10 nicht erkannt'
          assert not regex.search('DIN EN 61008-1'), 'Norm faelschlich als Typ erkannt'
          assert not regex.search('Basic 50'), 'Produktfamilie faelschlich als Typ erkannt'
          assert 'PDF-Zuordnung: ungeprüft' in source, 'Pruefstatus fehlt'
          print('PASS: 10 Regressionstests fuer Typen, Varianten und Pruefstatus')
          # Reale PDF-Datei im Test erzeugen, einlesen und auf Typen pruefen.
          # Keine Herstellerfreigabe aus synthetischen Testdokumenten ableiten.
          PY
          python3 -m pip install -q --disable-pip-version-check 'pypdf>=5,<7' 'reportlab>=4,<5'
          python3 - <<'PY'
          from io import BytesIO
          from reportlab.pdfgen import canvas
          from pypdf import PdfReader
          import ast,re
          from pathlib import Path
          code=Path('/tmp/tga224/app.py').read_text(encoding='utf-8')
          tree=ast.parse(code)
          fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='search_document_focused_web')
          pattern_node=next(n for n in ast.walk(fn) if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='type_pattern' for t in n.targets))
          pattern=re.compile(ast.literal_eval(pattern_node.value.args[0]),re.I)
          def make_pdf(lines):
              buffer=BytesIO()
              c=canvas.Canvas(buffer)
              for line in lines:
                  c.drawString(50,750,line)
                  c.showPage()
              c.save()
              buffer.seek(0)
              return buffer
          cases=[
              ('KERMI technische Typen', ['Gebrauchs- und Montageanleitung ERE10 AK3 / E0E10 AK3'], {'ERE10 AK3','E0E10 AK3'}),
              ('TROX Produktfamilie', ['TROX Brandschutzklappe FK2-EU'],set()),
              ('HELIOS Modell', ['HELIOS SilentBox SB 125 A'],set()),
              ('ROCKWOOL Nachweis', ['ROCKWOOL Conlit 150 U'],set()),
              ('Normenfilter', ['DIN EN 61008-1 und DIN VDE 0100-701'],set()),
          ]
          for label,lines,expected in cases:
              pdf=make_pdf(lines)
              pages=[p.extract_text() or '' for p in PdfReader(pdf).pages]
              assert len(pages)==len(lines) and all(pages), f'{label}: PDF-Text fehlt'
              found=set()
              for page in pages:
                  found.update(' '.join(m.group().upper().split()) for m in pattern.finditer(page))
              assert found==expected, f'{label}: {found!r} != {expected!r}'
              print('PASS: PDF-Rauchtest',label)
          print('PASS: 5 PDF-Testdokumente erzeugt, extrahiert und auf technische Typen geprueft')
          PY
          python3 -m pip install -q --disable-pip-version-check 'openpyxl>=3,<4'
          python3 - <<'PY'
          # Isolierter Datenfluss-Test mit echten XLSX- und PDF-Dateien.
          # Prueft noch NICHT die Streamlit-Bedienoberflaeche oder die gesamte App-Verkabelung.
          import io,re,hashlib,tempfile,os,ast
          from pathlib import Path
          from openpyxl import Workbook,load_workbook
          from reportlab.pdfgen import canvas
          from pypdf import PdfReader
          app=Path('/tmp/tga224/app.py').read_text(encoding='utf-8')
          tree=ast.parse(app)
          function=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='search_document_focused_web')
          assignment=next(n for n in ast.walk(function) if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='type_pattern' for t in n.targets))
          type_regex=re.compile(ast.literal_eval(assignment.value.args[0]),re.I)
          with tempfile.TemporaryDirectory() as tmp:
              folder=Path(tmp)
              wb=Workbook();ws=wb.active
              ws.append(['Gewerk','Produkt/Bezeichnung','Hersteller/Fabrikat','Typ/Modell'])
              rows=[
                  ['Heizung','Badheizkoerper','KERMI','Basic-E'],
                  ['Lueftung','Brandschutzklappe','TROX','FK2-EU'],
                  ['Lueftung','Ventilator','HELIOS','SB 125 A'],
                  ['Heizung','Rohrabschottung','ROCKWOOL','Conlit 150 U']
              ]
              for row in rows:ws.append(row)
              xlsx=folder/'produkte.xlsx';wb.save(xlsx)
              imported=list(load_workbook(xlsx,read_only=True,data_only=True).active.values)
              assert imported[0]==('Gewerk','Produkt/Bezeichnung','Hersteller/Fabrikat','Typ/Modell')
              assert [tuple(r) for r in imported[1:]]==[tuple(r) for r in rows]
              def pdf_bytes(text):
                  out=io.BytesIO();c=canvas.Canvas(out)
                  c.drawString(40,750,text);c.save()
                  return out.getvalue()
              pdf=pdf_bytes('ERE10 AK3 / E0E10 AK3 Montageanleitung')
              parsed=' '.join(p.extract_text() or '' for p in PdfReader(io.BytesIO(pdf)).pages)
              types={m.group().upper() for m in type_regex.finditer(parsed)}
              assert types=={'ERE10 AK3','E0E10 AK3'}
              assert not any(row[3].upper() in types for row in rows), 'Falsche automatische Familienzuordnung'
              assert 'BASIC-E' not in parsed.upper(), 'Testdokument ist faelschlich eindeutig'
              target=folder/'offline'/'kermi';target.mkdir(parents=True)
              index={}
              def save_once(data,name):
                  digest=hashlib.sha256(data).hexdigest()
                  if digest in index:return index[digest]
                  dest=target/name
                  dest.write_bytes(data);index[digest]=dest
                  return dest
              a=save_once(pdf,'montageanleitung.pdf')
              b=save_once(pdf,'montageanleitung_kopie.pdf')
              assert a==b and len(list(target.glob('*.pdf')))==1
              assert a.read_bytes()==pdf
              assert len(index)==1
              print('PASS: XLSX 4 Produkte -> PDF-Text -> Typenabgleich ohne Freigabe -> Offline-Ablage -> SHA256-Duplikatschutz')
          PY
          python3 - <<'PY'
          import ast,re
          from pathlib import Path
          from io import BytesIO
          from reportlab.pdfgen import canvas
          from pypdf import PdfReader
          source=Path('/tmp/tga224/app.py').read_text(encoding='utf-8')
          function=next(n for n in ast.parse(source).body if isinstance(n,ast.FunctionDef) and n.name=='search_document_focused_web')
          assignments=[n for n in ast.walk(function) if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='type_pattern' for t in n.targets)]
          assert len(assignments)==1
          pattern=re.compile(ast.literal_eval(assignments[0].value.args[0]),re.I)
          cases=[('KERMI','ERE10 AK3 / E0E10 AK3',{'ERE10 AK3','E0E10 AK3'}),('Normen','DIN EN 61008-1',set()),('TROX','TROX FK2-EU',set()),('HELIOS','HELIOS SB 125 A',set()),('ROCKWOOL','ROCKWOOL Conlit 150 U',set())]
          for label,content,expected in cases:
              stream=BytesIO()
              doc=canvas.Canvas(stream)
              doc.drawString(50,750,content)
              doc.save()
              actual=set()
              for page in PdfReader(BytesIO(stream.getvalue())).pages:
                  actual.update(' '.join(m.group().upper().split()) for m in pattern.finditer(page.extract_text() or ''))
              assert actual==expected,(label,actual,expected)
              print('PASS: PDF-Test mit Typenmuster aus Produktivcode:',label)
          print('PASS: 5 produktivcodegebundene PDF-Mustertests')
          PY
          python3 - <<'PY'
          # Regression fuer KERMI Basic-E gegen Basic 50 und Schreibvarianten
          import ast,re
          from pathlib import Path
          s=Path('/tmp/tga224/app.py').read_text(encoding='utf-8')
          f=next(n for n in ast.parse(s).body if isinstance(n,ast.FunctionDef) and n.name=='search_document_focused_web')
          expr=next(n.value for n in f.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='basic_e' for t in n.targets))
          for product in ['Basic-E','Basic E','Basic–E','Basic—E','Basic‐E','BASIC E']:
              value=eval(compile(ast.Expression(expr),'app.py','eval'),{'manufacturer':'KERMI','product':product,'model':'','re':re})
              assert value,product
          for product in ['Basic 50','Basic-50','Basic-ER','Basic-E50']:
              value=eval(compile(ast.Expression(expr),'app.py','eval'),{'manufacturer':'KERMI','product':product,'model':'','re':re})
              assert not value,product
          print('PASS: KERMI Basic-E Schreibweisen und Basic 50/Basic-E50 Trennung')
          PY
          # Streamlit-Starttest: Server muss mit dem echten app.py hochfahren.
          python3 -m pip install -q --disable-pip-version-check 'streamlit>=1.40,<2' 'beautifulsoup4>=4,<5' 'requests>=2,<3' 'pandas>=2,<3' 'openpyxl>=3,<4' 'pypdf>=5,<7'
          set +e
          timeout 35s python3 -m streamlit run /tmp/tga224/app.py --server.headless=true --server.address=127.0.0.1 --server.port=18501 --browser.gatherUsageStats=false >/tmp/tga224/streamlit.log 2>&1 &
          SERVER_PID=$!
          set -e
          READY=0
          for i in $(seq 1 25); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18501/_stcore/health | grep -q 'ok'; then READY=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo 'FAIL: Streamlit health endpoint nicht erreichbar'
            tail -n 100 /tmp/tga224/streamlit.log
            exit 1
          fi
          echo 'PASS: Streamlit-App startet und Health-Endpunkt antwortet'
          # Fuehrt den Streamlit-Skriptlauf aus (nicht nur Server-Health).
          python3 - <<'PY'
          import os
          from pathlib import Path
          from streamlit.testing.v1 import AppTest
          os.environ['TGA_TEST_MODE']='1'
          app=Path('/tmp/tga224/app.py')
          result=AppTest.from_file(str(app),default_timeout=25).run()
          errors=list(result.exception)
          if errors:
              for error in errors[:3]:print('APP-ERROR:',str(error.message)[:500])
          assert not errors, 'Streamlit-Skriptlauf enthaelt Ausnahmen'
          print('PASS: Streamlit-AppTest fuehrt die Hauptseite ohne Ausnahme aus')
          PY
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          (cd /tmp/tga224 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.2.4.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v2.2.4.zip
          python3 - <<'PY'
          import zipfile,ast
          path='TGA_Product_Finder_Update_v2.2.4.zip'
          with zipfile.ZipFile(path) as z:
              names=set(z.namelist())
              assert {'app.py','version.json','TGA_Updater.ps1'} <= names, 'Update-Dateien fehlen'
              app=z.read('app.py').decode('utf-8')
              assert 'APP_VERSION = "2.2.4"' in app, 'Falsche App-Version'
              ast.parse(app)
          print('PASS: ZIP-Paket, App-Version und Python-Syntax')
          PY
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.2.4.zip
          git commit -m 'Build TGA Product Finder v2.2.4'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v2.2.4.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'2.2.4','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v2.2.4.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v2.2.4 update manifest'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
