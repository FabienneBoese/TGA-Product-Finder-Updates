name: Publish TGA Product Finder v2.0.10
on:
  push:
    paths:
      - '.github/workflows/publish-v208.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga210
          unzip -q TGA_Product_Finder_Update_v2.0.9.zip -d /tmp/tga210
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          p=Path('/tmp/tga210/app.py')
          s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "2.0.9"')==1
          s=s.replace('APP_VERSION = "2.0.9"','APP_VERSION = "2.0.10"',1)
          old="domains={'helios':'heliosventilatoren.de','trox':'trox.de','rockwool':'rockwool.com','geberit':'geberit.de','grohe':'grohe.de','danfoss':'danfoss.com'}"
          assert s.count(old)==1
          new="domains={'helios':'heliosventilatoren.de','trox':'trox.de','rockwool':'rockwool.com','geberit':'geberit.de','grohe':'grohe.de','danfoss':'danfoss.com','grundfos':'grundfos.com','wilo':'wilo.com','viega':'viega.de','uponor':'uponor.com','kermi':'kermi.com','geberit':'geberit.de','swegon':'swegon.com','systemair':'systemair.com','wolf':'wolf.eu','vaillant':'vaillant.de','bosch':'bosch-homecomfort.com','siemens':'siemens.com','belimo':'belimo.com','schneider':'se.com','hager':'hager.de','jung':'jung.de','gira':'gira.de','geberit':'geberit.de','tece':'tece.com','dallmer':'dallmer.de','aco':'aco.com','puren':'puren.com','hilti':'hilti.de','knauf':'knauf.com'}"
          s=s.replace(old,new,1)
          oldquery="query='site:'+domain+' '+manufacturer+' '+product+' '+model"
          assert s.count(oldquery)==1
          s=s.replace(oldquery,"query='site:'+domain+' '+ ' '.join(str(x or '').strip() for x in (manufacturer,product,model) if str(x or '').strip())",1)
          olderr="raise ValueError('Keine eindeutig passende Hersteller-Produktseite mit PDFs automatisch gefunden. Die manuelle Herstelleradresse bleibt als Alternative verfügbar.')"
          assert s.count(olderr)==1
          s=s.replace(olderr,"raise ValueError('Keine eindeutig passende offizielle Produktseite mit PDFs gefunden. Bitte Hersteller, Typ und Artikelnummer prüfen oder die offizielle Produktadresse verwenden.')",1)
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          assert Path('/tmp/tga210/TGA_Updater.ps1').exists()
          print('PASS: Python syntax and updater present')
          PY
          (cd /tmp/tga210 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.0.10.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v2.0.10.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.0.10.zip
          git commit -m 'Build TGA Product Finder v2.0.10'
          git pull --rebase origin main
          git push
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v2.0.10.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'2.0.10','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v2.0.10.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v2.0.10 update manifest'
          git pull --rebase origin main
          git push
