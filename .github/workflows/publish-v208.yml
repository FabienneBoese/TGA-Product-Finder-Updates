name: Publish TGA Product Finder v2.0.17 Offline Save
on:
  push:
    paths:
      - '.github/workflows/publish-v208.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga217
          unzip -q TGA_Product_Finder_Update_v2.0.16.zip -d /tmp/tga217
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          p=Path('/tmp/tga217/app.py')
          s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "2.0.16"')==1
          s=s.replace('APP_VERSION = "2.0.16"','APP_VERSION = "2.0.17"',1)
          from urllib.parse import urlparse
          trusted_kermi="https://www.heizungsdiscount24.de/pdf/Kermi-Badheizkoerper-Basic-E-AK3-Montageanleitung.pdf"
          original="u.hostname.lower() in ('heliosventilatoren.de','assets.danfoss.com') or u.hostname.lower().endswith('.heliosventilatoren.de')"
          assert s.count(original)==1
          s=s.replace(original,"("+original+" or url=="+repr(trusted_kermi)+")",1)
          final_original="final.hostname.lower() in ('heliosventilatoren.de','assets.danfoss.com') or final.hostname.lower().endswith('.heliosventilatoren.de')"
          assert s.count(final_original)==1
          s=s.replace(final_original,"("+final_original+" or (url=="+repr(trusted_kermi)+" and response.url=="+repr(trusted_kermi)+"))",1)
          assert s.count("Nur freigegebene offizielle Hersteller-PDF-Hosts zulässig.")==1
          assert "KERMI-PDF jetzt offline speichern" in s
          print('PASS: exact URL allowlist, redirect and KERMI UI checks')
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          assert Path('/tmp/tga217/TGA_Updater.ps1').exists()
          print('PASS: Python syntax and updater present')
          PY
          (cd /tmp/tga217 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.0.17.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v2.0.17.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.0.17.zip
          git commit -m 'Build TGA Product Finder v2.0.17'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v2.0.17.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'2.0.17','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v2.0.17.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v2.0.17 update manifest'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
