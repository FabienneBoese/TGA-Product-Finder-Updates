name: Publish TGA Product Finder v2.0.11
on:
  push:
    paths:
      - '.github/workflows/publish-v208.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga211
          unzip -q TGA_Product_Finder_Update_v2.0.10.zip -d /tmp/tga211
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          p=Path('/tmp/tga211/app.py')
          s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "2.0.10"')==1
          s=s.replace('APP_VERSION = "2.0.10"','APP_VERSION = "2.0.11"',1)
          old="st.caption('Automatische Herstellersuche für dieses Produkt noch nicht aktiviert.'); st.link_button('Herstellerbezogene Produktsuche öffnen',google_url(m,p,a))"
          assert s.count(old)==1
          s=s.replace(old,"st.info('Für dieses Produkt die universelle Dokumentensuche oben verwenden. Klicke auf Produktseite und Dokumente automatisch suchen. Keine Weiterleitung zu Google erforderlich.')",1)
          old="st.caption('Für noch nicht unterstützte Hersteller: Offizielle Produktseite eintragen. Gefundene Dokumente werden als ungeprüfte Kandidaten angezeigt, nicht freigegeben.')"
          assert s.count(old)==1
          s=s.replace(old,"st.caption('Für alle weiteren Hersteller: Zuerst Produktseite und Dokumente automatisch suchen anklicken. Eine manuelle Herstelleradresse ist nur als Alternative nötig. PDF-Kandidaten bleiben prüfpflichtig.')",1)
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          assert Path('/tmp/tga211/TGA_Updater.ps1').exists()
          print('PASS: Python syntax and updater present')
          PY
          (cd /tmp/tga211 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.0.11.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v2.0.11.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.0.11.zip
          git commit -m 'Build TGA Product Finder v2.0.11'
          git pull --rebase origin main
          git push
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v2.0.11.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'2.0.11','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v2.0.11.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v2.0.11 update manifest'
          git pull --rebase origin main
          git push
