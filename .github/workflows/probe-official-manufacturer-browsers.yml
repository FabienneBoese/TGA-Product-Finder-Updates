name: Browser-Test gesperrter Herstellerwebsites
on:
  push:
    paths: ['.github/workflows/probe-official-manufacturer-browsers.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium for standard browser access
        run: |
          python -m pip install -q requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Verify manufacturer-owned entry pages in a real browser
        run: |
          python - <<'PY'
          import json,sys
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          sys.path.insert(0,"research")
          from manufacturer_website_check import OFFICIAL_ENTRY_URLS,official_hosts,permitted_host,domain_name,BLOCK_MARKERS
          tests = {
            "WIKA": ("wika.com", ("https://blog.wika.com/de/",
                      "https://www.wika.com/de-de/startseite.WIKA",
                      "https://shop.wika.com/de-de/shop_startseite.WIKA")),
            "Villeroy & Boch": ("villeroy-boch.de", (
                      "https://innovationdays.villeroy-boch.com/de/startseite",
                      "https://www.villeroyboch-group.com/de/",
                      "https://pro.villeroy-boch.com/de/de/home")),
          }
          results={}
          with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True, args=["--disable-dev-shm-usage"])
            for maker,(domain,urls) in tests.items():
              allowed=official_hosts(domain); attempts=[]; accepted=None
              page=browser.new_page(locale="de-DE")
              for url in urls:
                if not permitted_host(domain_name(url),allowed):
                  attempts.append({"requested":url,"reason":"Not allowlisted"})
                  continue
                try:
                  response=page.goto(url,wait_until="domcontentloaded",timeout=18000)
                  status=response.status if response else None
                  final=page.url
                  title=page.title()[:140]
                  body=page.locator("body").inner_text(timeout=4000)[:2500]
                  blocked=any(x in (title+" "+body).lower() for x in BLOCK_MARKERS)
                  brand=("wika" in (title+" "+body).lower()) if maker=="WIKA" else any(x in (title+" "+body).lower() for x in ("villeroy","boch"))
                  ok=status==200 and permitted_host(domain_name(final),allowed) and brand and not blocked
                  attempts.append({"requested":url,"final":final,"status":status,"title":title,"brand_identified":brand,"challenge":blocked,"verified":ok})
                  if ok:accepted=final;break
                except Exception as exc:
                  attempts.append({"requested":url,"error":type(exc).__name__+":"+str(exc)[:180]})
              page.close()
              results[maker]={"verified_browser_url":accepted,"attempts":attempts}
            browser.close()
          print("BROWSER_RESULTS="+json.dumps(results,ensure_ascii=False))
          from pathlib import Path
          Path("browser_manufacturer_results.json").write_text(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-manufacturer-results
          path: browser_manufacturer_results.json
