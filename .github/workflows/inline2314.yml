name: Inline editor 2314
on:
  push:
    paths: ['.github/workflows/inline2314.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          mkdir /tmp/tga
          unzip -q TGA_Product_Finder_Update_v2.3.13.zip -d /tmp/tga
          python3 - <<'PY'
          from pathlib import Path
          import ast,json
          p=Path('/tmp/tga/app.py')
          s=p.read_text().replace('APP_VERSION = "2.3.13"','APP_VERSION = "2.3.14"',1)
          anchor=next(l for l in s.splitlines() if 'ovdf=pd.DataFrame(overview)' in l)
          assert s.count(anchor)==1
          s=s.replace(anchor,"   for _i,_r in enumerate(overview):\n    _r['Dokumentationsgruppe']=con.execute('SELECT doc_variant FROM components WHERE id=?',(rows[_i][0],)).fetchone()[0] or ''\n"+anchor,1)
          anchor=next(l for l in s.splitlines() if '_overview_event=st.dataframe(' in l)
          assert s.count(anchor)==1
          ui=[
          "   _options=['','Standardausführung','ATEX-Ausführung','Systemrohr','Formstück / Muffe','Gesamtes System','Allgemeine Unterlagen','Abweichende Nachweise']",
          "   _edited=st.data_editor(ovdf,height=max(420,38*(len(ovdf)+1)),hide_index=True,key='doc_inline_editor',disabled=[c for c in ovdf.columns if c!='Dokumentationsgruppe'],column_config={'Dokumentationsgruppe':st.column_config.SelectboxColumn('Dokumentationsgruppe',options=_options)})",
          "   for _idx,_item in _edited.iterrows():",
          "    _new=str(_item['Dokumentationsgruppe'] or '')",
          "    _old=str(ovdf.iloc[_idx]['Dokumentationsgruppe'] or '')",
          "    if _new!=_old:",
          "     _maker=str(rows[_idx][1]).lower()",
          "     _prod=str(rows[_idx][2]).lower()",
          "     _allowed=['Standardausführung','ATEX-Ausführung'] if 'trox' in _maker and 'fk2' in _prod else (['Systemrohr','Formstück / Muffe','Gesamtes System'] if 'geberit' in _maker and 'mapress' in _prod else ['Allgemeine Unterlagen','Abweichende Nachweise'])",
          "     if _new and _new not in _allowed:st.warning('Nicht passende Dokumentationsgruppe für '+str(rows[_idx][1]))",
          "     else:",
          "      con.execute('UPDATE components SET doc_variant=? WHERE id=?',(_new,rows[_idx][0]))",
          "      con.commit()",
          "      st.success('Dokumentationsgruppe gespeichert.')",
          "   _overview_event=None"
          ]
          s=s.replace(anchor,'\n'.join(line[1:] for line in ui),1)
          s=s.replace('    _selected_rows=_overview_event.selection.rows','    _selected_rows=[]',1)
          anchor=next(l for l in s.splitlines() if '_scope_label=_selected_label if' in l)
          assert s.count(anchor)==1
          s=s.replace(anchor,"   _selected_label=st.selectbox('Produktdetails öffnen',_scope_labels,index=_scope_labels.index(_selected_label) if _selected_label in _scope_labels else 0)\n"+anchor,1)
          ast.parse(s)
          p.write_text(s)
          v=Path('/tmp/tga/version.json')
          d=json.loads(v.read_text());d['version']='2.3.14';v.write_text(json.dumps(d))
          print('PASS syntax')
          PY
          python3 -m pip install -q streamlit pandas openpyxl requests beautifulsoup4 pypdf
          TGA_DATA_DIR=/tmp/tga_test python3 - <<'PY'
          import os,sqlite3
          from streamlit.testing.v1 import AppTest
          os.chdir('/tmp/tga')
          a=AppTest.from_file('app.py').run()
          assert not a.exception,a.exception
          c=sqlite3.connect('/tmp/tga_test/tga_finder.db')
          c.execute("INSERT INTO components(project,manufacturer,product,confidence,status,docs_searched) VALUES('Testprojekt','TROX','FK2-EU',90,'Prüfen',0)")
          c.commit()
          a.radio[0].set_value('📊 Dokumentenübersicht').run()
          assert not a.exception,a.exception
          assert a.data_editor
          print('PASS editable table')
          PY
          (cd /tmp/tga && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.3.14.zip" app.py version.json TGA_Updater.ps1)
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.3.14.zip
          git commit -m 'Release inline editor 2.3.14'
          git pull --rebase origin main
          git push origin HEAD:main
