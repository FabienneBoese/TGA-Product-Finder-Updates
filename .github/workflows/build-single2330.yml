name: Build single product scope 2330
on:
  push:
    paths: ['.github/workflows/build-single2330.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          python3 -m pip install -q streamlit pandas openpyxl requests beautifulsoup4 pypdf
          python3 -m unittest discover -s research -p 'test_article_identity_records.py' -v
          mkdir -p /tmp/tga2330
          unzip -q TGA_Product_Finder_Update_v2.3.28.zip -d /tmp/tga2330
          python3 - <<'PY'
          from pathlib import Path
          import ast,json
          p=Path('/tmp/tga2330/app.py')
          s=p.read_text(encoding='utf-8')
          assert 'APP_VERSION = "2.3.28"' in s
          s=s.replace('APP_VERSION = "2.3.28"','APP_VERSION = "2.3.30"',1)
          # The product classifier is available in the app for the next
          # stage; keep the existing verified search flow unchanged.
          module=Path('research/article_identity_records.py').read_text(encoding='utf-8')
          s=module+'\n'+s
          ast.parse(s)
          p.write_text(s,encoding='utf-8')
          v=Path('/tmp/tga2330/version.json')
          d=json.loads(v.read_text());d['version']='2.3.30';v.write_text(json.dumps(d))
          PY
          TGA_DATA_DIR=/tmp/tga2330_data python3 - <<'PY'
          import os
          from streamlit.testing.v1 import AppTest
          os.chdir('/tmp/tga2330')
          a=AppTest.from_file('app.py',default_timeout=45).run()
          assert not a.exception,a.exception
          print('PASS Streamlit startup')
          PY
          (cd /tmp/tga2330 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.3.30.zip" app.py version.json TGA_Updater.ps1)
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('TGA_Product_Finder_Update_v2.3.30.zip')
          Path('update_manifest.json').write_text(json.dumps({'version':'2.3.30','download_url':'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/main/TGA_Product_Finder_Update_v2.3.30.zip','sha256':hashlib.sha256(p.read_bytes()).hexdigest()},indent=2))
          PY
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.3.30.zip update_manifest.json
          git commit -m 'Release single-product identification helpers 2.3.30'
          git pull --rebase origin main
          git push origin HEAD:main
