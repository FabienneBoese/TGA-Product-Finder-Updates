name: Build search improvements 2322
on:
  push:
    paths: ['.github/workflows/build-search2322.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          mkdir /tmp/tga
          unzip -q TGA_Product_Finder_Update_v2.3.21.zip -d /tmp/tga
          cat > /tmp/patch2322.py <<'PY'
          from pathlib import Path
          import ast,json
          p=Path('/tmp/tga/app.py');s=p.read_text()
          assert 'APP_VERSION = "2.3.21"' in s
          s=s.replace('APP_VERSION = "2.3.21"','APP_VERSION = "2.3.22"',1)
          # Expand diagnosis to show the full table instead of its own scroll pane.
          target=next(x for x in s.splitlines() if 'st.dataframe(_ident_rows' in x)
          s=s.replace(target,target.replace("height=max(250,min(900,38*(len(_ident_rows)+1)))","height=max(250,38*(len(_ident_rows)+1))"),1)
          marker='def _tga_maker_domain(maker):'
          assert marker in s
          helpers="""def _tga_article_search_links(maker, query):
              from urllib.parse import quote_plus
              domain=_tga_maker_domain(maker)
              phrase=(query or '').strip()
              searches=[
                  ('Hersteller-Produktsuche',phrase+' Artikelnummer Bestellnummer'),
                  ('Hersteller-PDF-Katalog',phrase+' Artikelnummer filetype:pdf'),
                  ('Alternativsuche',phrase+' Art.-Nr.'),
              ]
              if domain:
                  searches=[(title,term+' site:'+domain) for title,term in searches]
              return [('https://www.google.com/search?q='+quote_plus(term),title) for title,term in searches]

          """
          s=helpers+s
          anchor="st.link_button('Weitere Websuche öffnen'"
          line=next(x for x in s.splitlines() if anchor in x)
          ind=line[:len(line)-len(line.lstrip())]
          addition=ind+"for _url,_label in _tga_article_search_links(_maker,_q):\n"+ind+" st.link_button(_label,_url)"
          s=s.replace(line,line+'\n'+addition,1)
          ast.parse(s);p.write_text(s)
          v=Path('/tmp/tga/version.json');d=json.loads(v.read_text());d['version']='2.3.22';v.write_text(json.dumps(d))
          print('PASS syntax')
          PY
          python3 /tmp/patch2322.py
          python3 -m pip install -q streamlit pandas openpyxl requests beautifulsoup4 pypdf
          TGA_DATA_DIR=/tmp/tga_test python3 - <<'PY'
          import os,sqlite3
          from streamlit.testing.v1 import AppTest
          os.chdir('/tmp/tga')
          a=AppTest.from_file('app.py',default_timeout=45).run()
          assert not a.exception,a.exception
          c=sqlite3.connect('/tmp/tga_test/tga_finder.db')
          c.execute("INSERT INTO components(project,manufacturer,product,article_no,model_type,confidence,status,docs_searched) VALUES('Testprojekt','Helios','Ventilatorbox','09506','SB 125 A',90,'Prüfen',0)")
          c.commit()
          a.radio[0].set_value('📊 Dokumentenübersicht').run()
          assert not a.exception,a.exception
          assert any('Herstellerquellen recherchieren' in x.label for x in a.button)
          print('PASS Streamlit UI')
          PY
          (cd /tmp/tga && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.3.22.zip" app.py version.json TGA_Updater.ps1)
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.3.22.zip
          git commit -m 'Release search fallbacks and full height diagnosis 2.3.22'
          git pull --rebase origin main
          git push origin HEAD:main
