name: Publish TGA Product Finder v2.2.8 Generic Recognition Test
on:
  push:
    paths: ['.github/workflows/publish-v228.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tga228
          unzip -q TGA_Product_Finder_Update_v2.2.7.zip -d /tmp/tga228
          python3 - <<'PY'
          from pathlib import Path
          import ast,py_compile,re
          p=Path('/tmp/tga228/app.py')
          s=p.read_text(encoding='utf-8')
          assert s.count('APP_VERSION = "2.2.7"')==1
          s=s.replace('APP_VERSION = "2.2.7"','APP_VERSION = "2.2.8"',1)
          # Classify product series and model labels conservatively, without
          # pretending that a series designation is an exact article number.
          import ast,re
          a=s.index('def classify_component_identifier(')
          b=s.index('def db():',a)
          block=s[a:b]
          needle=" if not normalized:return ('','','empty')"
          assert block.count(needle)==1
          extra=""" if not normalized:return ('','','empty')
           series=('DUOFIX','NEWO','PRO LIBERTY','B.2','KEUCO PLAN','ART','PROFIPRESS','HT-SAFE','MAPRESS EDELSTAHL','FILLSET COMPACT')
           if any(normalized==v or normalized.startswith(v+' ') for v in series):
            return ('','','family')
           # A prefixed part number must contain a complete number, not a truncated UI value.
           prefixed=re.fullmatch(r'(?:ARTIKEL[- ]?NR\\.?|ART\\.?[- ]?NR\\.?)\\s*[:.]?\\s*(\\d{3}(?:\\.\\d{1,3}){2,3})',normalized)
           if prefixed:
            return ('',prefixed.group(1),'article')
          """
          block=block.replace(needle,extra,1)
          s=s[:a]+block+s[b:]
          # Keep the original Excel identifier; families migrate to product_family.
          # The overview should show a specific classification, never 'automatically
          # verifiable' just because a family name is present.
          anchor="overview.append({'Status':docstatus.split()[0]"
          a=s.index(anchor);b=s.index(chr(10),a)
          line=s[a:b]
          old="'Produkterkennung':('Kennung unklar – prüfen' if oa and classify_component_identifier(om,op,oa)[2]=='unclassified' else ('Typ erkannt – Herstellerprüfung offen' if _model else ('Produktfamilie erkannt – Variante prüfen' if con.execute('SELECT product_family FROM components WHERE id=?',(ocid,)).fetchone()[0] else ostat)))"
          assert old in line
          new="'Produkterkennung':('Produktfamilie erkannt – Variante prüfen' if con.execute('SELECT product_family FROM components WHERE id=?',(ocid,)).fetchone()[0] else ('Kennung unklar – prüfen' if oa and classify_component_identifier(om,op,oa)[2]=='unclassified' else ('Typ erkannt – Herstellerprüfung offen' if _model else ('Artikelnummer vorhanden – Herstellerprüfung offen' if oa else 'Angaben unvollständig – prüfen'))))"
          line=line.replace(old,new,1)
          s=s[:a]+line+s[b:]
          # A prefixed article number is normalized only when complete; never
          # infer a missing suffix from the source.
          tree=ast.parse(s)
          scope={'re':re}
          exec(compile(ast.Module(body=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='classify_component_identifier'],type_ignores=[]),'<test>','exec'),scope)
          fn=scope['classify_component_identifier']
          for value in ('Duofix','Newo','B.2','Pro Liberty','Keuco Plan','art','Profipress','HT-Safe'):
           assert fn('Unbekannter Hersteller','',value)[2]=='family',(value,fn('','',value))
          assert fn('Geberit','','Artikel-Nr.: 115.883.00.1')[2]=='article'
          assert fn('Geberit','','Artikel-Nr.: 115.8')[2]!='article'
          assert fn('Unknown','','A12')[2]=='unclassified'
          ast.parse(s)
          print('PASS: 11 cross-manufacturer classification and negative tests')
          p.write_text(s,encoding='utf-8')
          py_compile.compile(str(p),doraise=True)
          assert 'Produktfamilie erkannt – Variante prüfen' in s
          assert 'Artikelnummer vorhanden – Herstellerprüfung offen' in s
          print('PASS: identification statuses are not confused with data completeness')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/tga228/version.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['version']='2.2.8'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python3 -m pip install -q --disable-pip-version-check streamlit pandas openpyxl requests beautifulsoup4 pypdf
          python3 - <<'PY'
          from streamlit.testing.v1 import AppTest
          import os
          os.chdir('/tmp/tga228')
          at=AppTest.from_file('app.py',default_timeout=35).run()
          assert not at.exception,at.exception
          print('PASS: Streamlit AppTest')
          PY
          (cd /tmp/tga228 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.2.8.zip" app.py version.json TGA_Updater.ps1)
          unzip -t TGA_Product_Finder_Update_v2.2.8.zip
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.2.8.zip
          git commit -m 'Build v2.2.8 recognition integrity'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          PACKAGE_COMMIT=$(git rev-parse HEAD)
          SHA=$(sha256sum TGA_Product_Finder_Update_v2.2.8.zip | awk '{print $1}')
          python3 - "$SHA" "$PACKAGE_COMMIT" <<'PY'
          import json,sys
          sha,commit=sys.argv[1:]
          data={'version':'2.2.8','download_url':f'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/{commit}/TGA_Product_Finder_Update_v2.2.8.zip','sha256':sha}
          open('update_manifest.json','w').write(json.dumps(data,indent=2)+'\n')
          PY
          git add update_manifest.json
          git commit -m 'Publish v2.2.8 manifest'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
