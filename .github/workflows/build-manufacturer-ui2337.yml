name: Fix integrated manufacturer search v2.3.37
on:
  push:
    paths: ['.github/workflows/build-manufacturer-ui2337.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q streamlit pandas openpyxl requests beautifulsoup4 pypdf
          mkdir -p /tmp/tga2337
          unzip -q TGA_Product_Finder_Update_v2.3.36.zip -d /tmp/tga2337
          python3 research/build_manufacturer_ui2337.py
          TGA_DATA_DIR=/tmp/tga2337_data python3 - <<'PY'
          import os
          from streamlit.testing.v1 import AppTest
          os.chdir('/tmp/tga2337')
          at=AppTest.from_file('app.py',default_timeout=45).run()
          assert not at.exception,at.exception
          assert any('Herstellerwebsites und Produktseiten' in x.label for x in at.expander)
          print('PASS: manufacturer search visible without separate modules')
          PY
          (cd /tmp/tga2337 && zip -q -r "$GITHUB_WORKSPACE/TGA_Product_Finder_Update_v2.3.37.zip" app.py version.json TGA_Updater.ps1)
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('TGA_Product_Finder_Update_v2.3.37.zip')
          Path('update_manifest.json').write_text(json.dumps({'version':'2.3.37','download_url':'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/main/TGA_Product_Finder_Update_v2.3.37.zip','sha256':hashlib.sha256(p.read_bytes()).hexdigest()},indent=2))
          PY
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TGA_Product_Finder_Update_v2.3.37.zip update_manifest.json
          git commit -m 'Release fixed self-contained manufacturer search v2.3.37'
          git pull --rebase origin main
          git push origin HEAD:main
