name: Diagnose KERMI save integration
on:
  push:
    paths:
      - '.github/workflows/diagnose-kermi.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -p TGA_Product_Finder_Update_v2.0.21.zip app.py > /tmp/tga_app.py
          python3 - <<'PY'
          s=open('/tmp/tga_app.py').read().splitlines()
          for i in range(1590,1665):
              print(f'{i+1:04d} {s[i]}')
          for i,l in enumerate(s):
              if l.startswith('def universal_docs_from_official_page') or l.startswith('def find_official') or l.startswith('def kermi_basic_official_documents'):
                  print('FUNCTION AT',i+1)
                  for j in range(i,min(i+36,len(s))):print(f'{j+1:04d} {s[j]}')
          PY
