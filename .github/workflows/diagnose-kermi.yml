name: Diagnose KERMI save integration
on:
  push:
    paths:
      - '.github/workflows/diagnose-kermi.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -p TGA_Product_Finder_Update_v2.0.19.zip app.py > /tmp/tga_app.py
          python3 - <<'PY'
          s=open('/tmp/tga_app.py').read().splitlines()
          for i,l in enumerate(s):
              if any(k in l for k in ('universal_search','universal-hits','search_documents','Dokumentenkandidaten','search_strategy','Suchmuster')):
                  print(f'--- LINE {i+1} ---')
                  for j in range(max(0,i-5),min(len(s),i+16)) :
                      print(f'{j+1:04d} {s[j]}')
          PY
