name: Manifest 2313
on:
  push:
    paths: ['.github/workflows/manifest2313.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('TGA_Product_Finder_Update_v2.3.13.zip')
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          d={'version':'2.3.13','download_url':'https://raw.githubusercontent.com/FabienneBoese/TGA-Product-Finder-Updates/9b830ddee27c1bed353f6d340f08a42c08d03639/TGA_Product_Finder_Update_v2.3.13.zip','sha256':sha}
          Path('update_manifest.json').write_text(json.dumps(d,indent=2))
          PY
          git config user.name 'TGA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add update_manifest.json
          git commit -m 'Activate v2.3.13'
          git push
